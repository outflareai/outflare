# Alert rules for Outflare's operational metrics (docs/monitoring.md).
# Prometheus loads them as they are; Grafana Cloud takes them with
# `mimirtool rules load deploy/monitoring/alerts.yml`. The thresholds suit
# a single server; change them in your copy rather than silencing alerts.
groups:
  - name: outflare
    rules:
      - alert: OutflareDown
        # absent() covers service discovery finding no server at all.
        expr: up{job="outflare"} == 0 or absent(up{job="outflare"})
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "Outflare's metrics can't be read: the server is down or restarting."

      - alert: OutflareHighErrorRate
        expr: |
          sum(rate(outflare_http_requests_total{code="5xx"}[5m]))
            / clamp_min(sum(rate(outflare_http_requests_total[5m])), 0.1) > 0.02
        for: 10m
        labels: { severity: critical }
        annotations:
          summary: "More than 2% of requests are failing with a 5xx."

      - alert: OutflareSlowRequests
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(outflare_http_request_duration_seconds_bucket{route!="GET /mcp"}[5m]))) > 2
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "95th percentile request time is over 2 seconds."

      - alert: OutflarePartnerTaskChecksFailing
        expr: sum(increase(outflare_jobs_processed_total{kind="partners.task_check",outcome=~"retried|dead"}[15m])) > 3
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Partner task checks are failing repeatedly; inspect job logs and the workspace page-reader connection."

      - alert: OutflareJobBacklog
        expr: max by (kind) (outflare_jobs_oldest_due_seconds) > 600
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "A job has waited over 10 minutes for a worker ({{ $labels.kind }}): workers are saturated or stuck."

      - alert: OutflareSiteEventsBehind
        expr: max(outflare_inbox_oldest_seconds) > 300
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Website events have waited over 5 minutes to be stored: no worker is running, or workers can't keep up. They are safe in the inbox."

      - alert: OutflareSiteEventsSetAside
        expr: max(outflare_inbox_failed) > 0
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "Website event batches failed 5 times and were set aside (site_events.store_failed in the logs)."

      - alert: OutflareFlagsFailing
        expr: sum(rate(outflare_flags_requests_total{outcome="error"}[5m])) / clamp_min(sum(rate(outflare_flags_requests_total[5m])), 1e-9) > 0.02
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Over 2% of requests for visitors' feature flags fail: sites show their default instead of their variants. Look for errors on POST /v1/site/flags and .../flags/evaluate in the logs (usually the database)."

      - alert: OutflareFlagsSlow
        expr: histogram_quantile(0.95, sum by (le) (rate(outflare_flags_request_seconds_bucket[5m]))) > 0.25
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "Deciding feature flags takes over 250 ms at the 95th percentile, so pages wait longer to show their variant. Check the database pool and the Feature flags row."

      - alert: OutflareConsentBannerFailing
        expr: sum(rate(outflare_site_consent_requests_total{outcome="error"}[5m])) / clamp_min(sum(rate(outflare_site_consent_requests_total[5m])), 1e-9) > 0.02
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Over 2% of consent banner requests fail: sites can't load their banner's settings, or visitors' choices aren't being kept as consents. Look for errors on GET and POST /v1/site/consent in the logs (usually the database)."

      - alert: OutflareAdMacrosUnfilled
        expr: sum by (network) (increase(outflare_ad_tracking_unfilled_macros_total[1h])) > 20
        for: 1h
        labels: { severity: info }
        annotations:
          summary: "Ads on {{ $labels.network }} keep arriving with tracking template macros the network didn't fill in, so their ad ids are lost. The macro in engine/internal/adtrack for that network is likely wrong: check it against the network's own docs (Ad tracking health row)."

      - alert: OutflarePaidArrivalsWithoutIds
        expr: (sum by (network) (increase(outflare_ad_tracking_arrivals_total{outcome="none"}[6h])) / clamp_min(sum by (network) (increase(outflare_ad_tracking_arrivals_total[6h])), 1)) > 0.8 and sum by (network) (increase(outflare_ad_tracking_arrivals_total[6h])) > 50
        for: 1h
        labels: { severity: info }
        annotations:
          summary: "Over 80% of paid landings from {{ $labels.network }} in 6 hours carry no click id or ad ids: those ads have no tracking template, or the network strips it. Credit falls back to UTM tags. Check the Ad tracking health row; workspaces add templates under Paid ads → Tracking templates."
      - alert: OutflareAdChangesFailing
        expr: sum(increase(outflare_ads_changes_total{outcome=~"failed|error"}[1h])) > 3
        labels: { severity: warning }
        annotations:
          summary: "More than three changes to ad campaigns (pausing, resuming, budgets) failed in an hour: a platform is refusing them (each change's error says why, GET .../ads/changes?status=failed; often a Meta token without ads_management) or the database failed. Check the Paid media (managing campaigns) row."
      - alert: OutflareContentPublishesFailing
        expr: sum(increase(outflare_content_publishes_total{outcome=~"failed|error"}[1h])) > 3
        labels: { severity: warning }
        annotations:
          summary: "More than three publications to a brand's CMS (WordPress, Ghost) failed in an hour: a site is refusing them (each publication's error says why, on the item under GET /v1/brands/{brand}/content/{id}; often an application password without the right to publish, or a Ghost key for a deleted integration) or the database failed. Check the Content (publishing to a CMS) row."
      - alert: OutflareAccountIncidentsCritical
        expr: sum(outflare_accounts_incidents_open{severity="critical"}) > 0
        for: 24h
        labels: { severity: warning }
        annotations:
          summary: "A critical incident on a brand's external account (a credential refused, a wrong identity signed in, an account locked) has been open for a day: automated use of that account is stopped until a person resolves it (GET /v1/brands/{brand}/account-incidents). Check the Accounts row."
      - alert: OutflareAccountTakeoverWaiting
        expr: max(outflare_accounts_takeovers_oldest_seconds) > 4 * 3600
        labels: { severity: warning }
        annotations:
          summary: "A takeover of a brand's external account has waited more than four hours for a person: a managed use met MFA, a CAPTCHA, a passkey or a consent screen and the brand's work on that account is stuck until someone starts the takeover (GET /v1/brands/{brand}/account-takeovers). Check the Accounts row."
      - alert: OutflareBrowserTasksWaiting
        expr: max(outflare_browser_tasks_oldest_seconds) > 1800
        labels: { severity: warning }
        annotations:
          summary: "A browser task has waited more than 30 minutes for a worker with a browser: no process with Chrome is running (start one with OUTFLARE_ROLE=browser, docs/browser-workers.md) or they are all busy. Check the Browser workers row."
      - alert: OutflareBrowserTasksFailing
        expr: sum(increase(outflare_browser_tasks_total{status="failed"}[6h])) > 3 and sum(increase(outflare_browser_tasks_total{status="failed"}[6h])) / sum(increase(outflare_browser_tasks_total[6h])) > 0.5
        labels: { severity: warning }
        annotations:
          summary: "More than half of browser task runs in six hours failed. Each task's log (GET /v1/brands/{brand}/browser-tasks/{id}) says where it stopped: a site that changed, a sign-in refused, no AI connected, or no Chrome on the worker. Check the Browser workers row."
      - alert: OutflareAdSuggestionsFailing
        expr: sum(increase(outflare_ads_suggest_run_seconds_count{outcome="error"}[6h])) > 3
        labels: { severity: warning }
        annotations:
          summary: "More than three runs of the paid ads suggestions job failed in six hours (ad_suggestions.failed in the log, with the request id): suggestions and verdicts on approved changes are not being updated. Check the Paid media (suggestions) row."
      - alert: OutflareAdTestsFailing
        expr: sum(increase(outflare_ads_test_steps_total{outcome="error"}[6h])) > 3
        labels: { severity: warning }
        annotations:
          summary: "More than three steps of tests inside ad networks (start, check, end) failed in six hours (ad_test.failed in the log, with the request id): tests are not being started, read or ended. Check the Paid media (suggestions) row and the network's API status."
      - alert: OutflareAdDraftsFailing
        expr: sum(increase(outflare_ads_draft_steps_total{outcome="error"}[6h])) > 3
        labels: { severity: warning }
        annotations:
          summary: "More than three steps of approved new ads (making them paused, turning them on) failed in six hours (ad_draft.failed in the log, with the request id): new ads are not reaching the ad platform. Check the Paid media (suggestions) row and the network's API status."
      - alert: OutflareAdChangesUnverified
        expr: sum(increase(outflare_ads_changes_total{outcome="unverified"}[6h])) > 5
        labels: { severity: info }
        annotations:
          summary: "Over five campaign changes in six hours were applied but the platform did not show them when read back (verify_note on each change). The next sync corrects the mirror; if it keeps happening, the platform's read lags its writes or a change is being undone on their side."
      - alert: OutflareRedirectClicksNotWritten
        expr: sum(rate(outflare_redirect_click_writes_total{outcome=~"failed|dropped_full"}[5m])) > 0
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Redirect link clicks have failed to be written for 10 minutes (people are still sent on): look for tracking_link.click_failed in the logs, usually the database. Past 100,000 waiting in a process, new clicks are dropped. See the Redirect links row."

      - alert: OutflareTrackerPostbacksFailing
        expr: sum(rate(outflare_tracker_postbacks_total{outcome="error"}[5m])) > 0
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Tracker conversion postbacks have failed to be recorded for 10 minutes, so networks' conversions are being lost or retried: look for /t/ errors in the logs, usually the database. See the Tracker conversion postbacks panel on the Redirect links row."

      - alert: OutflareTrackerLanderClicksFailing
        expr: sum(rate(outflare_tracker_lander_clicks_total{outcome="error"}[5m])) > 0
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Lander clicks (/click) have failed for 10 minutes, so visitors on landers reach the domain's fallback page instead of an offer: look for /click errors in the logs, usually the database. See the Lander clicks panel on the Redirect links row."

      - alert: OutflareTrackerSourcePostbacksFailing
        expr: sum(rate(outflare_tracker_source_postbacks_total{outcome=~"unreachable|invalid"}[15m])) > 0
        for: 30m
        labels: { severity: warning }
        annotations:
          summary: "Conversions sent back to traffic sources have been given up on for 30 minutes, so networks aren't told of conversions and can't optimise: check the source postback sends (GET .../traffic-sources/{id}/postbacks) and the job logs. See the Conversions sent back panel on the Redirect links row."

      - alert: OutflareTrackerSuspectClicksHigh
        expr: sum(rate(outflare_tracker_fraud_flags_total{subject="click"}[30m])) > 0.5 * sum(rate(outflare_redirect_clicks_total{outcome="counted"}[30m])) and sum(rate(outflare_redirect_clicks_total{outcome="counted"}[30m])) > 0.1
        for: 30m
        labels: { severity: info }
        annotations:
          summary: "Over half of the tracker clicks in the last 30 minutes were flagged suspect (a hosting network or repeat clicks): a campaign is getting bot traffic, or a fraud detector misfires. See the Suspect tracker clicks panel on the Redirect links row, and the links' suspect_clicks."

      - alert: OutflareTrackerWeightSuggestionsSlow
        expr: histogram_quantile(0.95, sum by (le) (rate(outflare_tracker_weight_suggestions_seconds_bucket[30m]))) > 5
        for: 30m
        labels: { severity: warning }
        annotations:
          summary: "Suggested weights take over 5 seconds for the slowest 5% of links and flows: the click and conversion queries behind GET .../weight-suggestions need optimising (a link with very many clicks, or a missing index). See Time to suggest weights on the Redirect links row."

      - alert: OutflareTrackerWeightSuggestionsFailing
        expr: sum(increase(outflare_tracker_weight_suggestions_seconds_count{outcome="error"}[15m])) > 0
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "Suggested weights failed for 15 minutes, so people can't see or apply them: find the error by its request id in the engine log (GET .../weight-suggestions). See Time to suggest weights on the Redirect links row."

      - alert: OutflareRedirectClickBacklog
        expr: max(outflare_redirect_click_buffer) > 20000
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Over 20,000 redirect link clicks have waited in one process for 5 minutes: batches are being written too slowly or failing. Check the batch write time on the Redirect links row and the database; at 100,000 new clicks are dropped."

      - alert: OutflareRedirectClicksFailing
        expr: sum(rate(outflare_redirect_clicks_total{outcome="error"}[5m])) / clamp_min(sum(rate(outflare_redirect_clicks_total[5m])), 1e-9) > 0.05
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Over 5% of clicks on campaign redirect links couldn't look their link up, so those people saw an error. Usually the database: check the Redirect links row and the Postgres row."

      - alert: OutflareConsentBannerSlow
        expr: histogram_quantile(0.95, sum by (le) (rate(outflare_site_consent_request_seconds_bucket[5m]))) > 0.5
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "Consent banner requests take over 500 ms at the 95th percentile, so the banner shows late on a visitor's first page. Check the database pool and the Consent banner row."

      - alert: OutflareCookieScansFailing
        expr: sum(increase(outflare_cookie_scan_scans_total{outcome="failed"}[6h])) / clamp_min(sum(increase(outflare_cookie_scan_scans_total[6h])), 1) > 0.5 and sum(increase(outflare_cookie_scan_scans_total[6h])) > 5
        for: 30m
        labels: { severity: warning }
        annotations:
          summary: "Over half of cookie scans in the last 6 hours read no page: OutflareBot may be blocked, or outbound requests from the server failing. See cookie_scan.finished failures in the logs."

      - alert: OutflareCookieReportsFailing
        expr: sum(rate(outflare_cookie_scan_reports_total{outcome="error"}[10m])) / clamp_min(sum(rate(outflare_cookie_scan_reports_total[10m])), 1e-9) > 0.05
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "Over 5% of browsers' cookie reports fail to be kept, so cookie policies stop learning what sites use. Look for errors on POST /v1/site/cookies in the logs (usually the database)."
      - alert: OutflareABResultsSlow
        expr: histogram_quantile(0.95, sum by (le) (rate(outflare_ab_results_seconds_bucket[30m]))) > 10
        for: 30m
        labels: { severity: info }
        annotations:
          summary: "Counting A/B test results takes over 10 seconds at the 95th percentile: a busy site's tests scan many product events. Check the Feature flags row and slow queries on customer_events; caching results or reading them from ClickHouse is the fix."

      - alert: OutflareABResultsFailing
        expr: sum(increase(outflare_ab_results_total{outcome="error"}[30m])) > 5
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Over 5 A/B test results failed to count in 30 minutes, so people can't see how their tests are doing or end them. Look for errors on .../ab-tests/{test}/results and .../end in the logs (a query over its 30-second limit, or the database)."

      - alert: OutflareSmartListsBehind
        expr: max(outflare_smart_lists_oldest_refresh_seconds) > 3600
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "A smart list hasn't been brought up to date for over an hour (normal is 15 minutes): no worker is running, or smart_list.refresh jobs are failing. See smart_list.refreshed failures in the logs."

      - alert: OutflareSmartListsFailing
        expr: max(outflare_smart_lists_failing) > 0
        for: 30m
        labels: { severity: info }
        annotations:
          summary: "Some smart lists' last refresh failed, usually query_timeout (rules too broad to count in two minutes). The list shows the error; its owner can narrow the rules."

      - alert: OutflareMCPClientFailing
        expr: sum(increase(outflare_mcp_client_calls_total{outcome="error"}[30m])) > 20 and sum(increase(outflare_mcp_client_calls_total{outcome="error"}[30m])) > 0.5 * sum(increase(outflare_mcp_client_calls_total[30m]))
        labels: { severity: warning }
        annotations:
          summary: "Over half of Outflare's calls to MCP servers failed in the last 30 minutes. A server is down, refuses its credentials, or is on a private address; the MCP servers row shows which operation fails."
      - alert: OutflareActionsWaiting
        expr: max(outflare_actions_oldest_held_seconds) > 172800
        for: 30m
        labels: { severity: info }
        annotations:
          summary: "An agent's change has waited over two days for a person. The agent is blocked on it; the approval inbox is GET .../actions?status=held, and the Agent actions row shows how many wait."

      - alert: OutflareActionsStuckRunning
        expr: max(outflare_actions_running_stuck) > 0
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "An agent change was claimed to run over 15 minutes ago and never recorded how it ended: an engine stopped mid-change. Check the action's result in the engine log (action result) and what the change did in the audit log by its request_id."

      - alert: OutflareActionsFailing
        expr: sum(increase(outflare_actions_finished_total{outcome="failed"}[1h])) > 50
        labels: { severity: info }
        annotations:
          summary: "Over 50 agent changes an hour ran and got an error answer. An agent is repeating a request the API refuses; list its actions with status=failed and look at result."

      - alert: OutflareAgentRunsOverdue
        expr: max(outflare_agent_runs_overdue_seconds) > 900
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "A running agent run's next turn is over 15 minutes overdue: the runner (RunAgentRuns in the engine) isn't taking agent run turns. Check the engine log for agent run turns errors."

      - alert: OutflareAgentRunTurnsFailing
        expr: sum(increase(outflare_agent_runs_turns_total{outcome="failed"}[1h])) > sum(increase(outflare_agent_runs_turns_total{outcome="done"}[1h])) and sum(increase(outflare_agent_runs_turns_total{outcome="failed"}[1h])) >= 3
        for: 30m
        labels: { severity: warning }
        annotations:
          summary: "More agent run turns fail than finish (last hour): a model or the API is broken for several runs. agent_run.turn_failed events carry the error code; each run's turn_error says what happened."

      - alert: OutflareRuleTimersBehind
        expr: max(outflare_rules_oldest_due_seconds) > 900
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "An absence rule's timer has been due for over 15 minutes (normal is under two): no worker is running the rules sweep, or it keeps failing. Check rule.timers_failed in the logs and the Rules row."

      - alert: OutflareRuleTimersPiling
        expr: max(outflare_rules_timers_due) > 10000
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "Over 10,000 absence timers are due and waiting. The sweep handles 200 at a time per worker; look at the Rules row for a burst (a rule with a short time on a busy event) and add workers or slow it down."

      - alert: OutflareRuleJobsFailing
        expr: sum by (kind) (increase(outflare_jobs_processed_total{kind=~"rule\\..*",outcome=~"retried|dead"}[15m])) > 5
        labels: { severity: warning }
        annotations:
          summary: "Rule jobs ({{ $labels.kind }}) are failing and retrying, so rules fire late or not at all. Find the job's error in the logs (job.failed with this kind)."

      - alert: OutflareLifecycleSweepBehind
        expr: max(outflare_lifecycle_oldest_due_seconds) > 900
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "A lifecycle inactivity check (at risk, churned for no usage) has been due for over 15 minutes (normal is under two): no worker is running the lifecycle sweep, or it keeps failing. Check lifecycle.sweep_failed in the logs and the Lifecycle stages row."

      - alert: OutflareLifecycleDuePiling
        expr: max(outflare_lifecycle_due) > 10000
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "Over 10,000 lifecycle inactivity checks are due and waiting. The sweep handles 200 at a time per worker; a brand that just changed a product's days or its moves rechecks every state. See the Lifecycle stages row, and add workers if it doesn't drain."

      - alert: OutflareLifecycleJobsFailing
        expr: sum(increase(outflare_jobs_processed_total{kind="lifecycle.event",outcome=~"retried|dead"}[15m])) > 5
        labels: { severity: warning }
        annotations:
          summary: "lifecycle.event jobs are failing and retrying, so companies and people move between product stages late or not at all. Find the job's error in the logs (job.failed with kind lifecycle.event)."

      - alert: OutflareMetricSweepBehind
        expr: max(outflare_record_metrics_oldest_due_seconds) > 1800
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Live metric values have waited over 30 minutes for their window to move on (normal is minutes after midnight UTC): no worker runs the metric sweep, or it keeps failing. Check metric.sweep_failed in the logs and the Metrics row."

      - alert: OutflareMetricJobsFailing
        expr: sum(increase(outflare_jobs_processed_total{kind=~"metric\\..*",outcome=~"retried|dead"}[15m])) > 5
        labels: { severity: warning }
        annotations:
          summary: "Metric jobs (live updates or fills from history) are failing and retrying, so metrics fall behind. Find the job's error in the logs (job.failed with kind metric.event or metric.backfill)."

      - alert: OutflareMetricBackfillStuck
        expr: max(outflare_record_metrics_backfilling) > 0
        for: 1h
        labels: { severity: info }
        annotations:
          summary: "A metric has been refilling from stored events for over an hour: a very large brand, or a fill that keeps failing. Live events for it wait until it ends. See the Metrics row and metric.backfill jobs."

      - alert: OutflareBulkEditStuck
        expr: max(outflare_bulk_edits_oldest_pending_seconds) > 7200
        labels: { severity: warning }
        annotations:
          summary: "A bulk edit has been queued or running for over 2 hours: its job isn't running or keeps retrying. See the Bulk edits row and bulk_edits.run jobs (job.failed)."

      - alert: OutflareBulkEditsFailing
        expr: sum(increase(outflare_bulk_edits_total{outcome="failed"}[1h])) > 0
        labels: { severity: warning }
        annotations:
          summary: "A bulk edit failed part way after its retries: some records changed, the rest didn't. Its error and counts.done say where it stopped; find the cause in the logs (job.failed with kind bulk_edits.run)."

      - alert: OutflareHandEditsBehind
        expr: max(outflare_hand_edits_oldest_due_seconds) > 3600
        labels: { severity: warning }
        annotations:
          summary: "An expired hand edit has waited over an hour for the sweep, which runs every 5 minutes: it isn't running or keeps failing, so people's old edits keep winning. See the Field sources row and hand_edits.sweep_failed or hand_edit.expire_failed in the logs."

      - alert: OutflareHandEditsFailing
        expr: sum(increase(outflare_hand_edits_expired_total{outcome="error"}[1h])) > 5
        labels: { severity: warning }
        annotations:
          summary: "Hand edits are failing to expire (the sweep retries them every 5 minutes). Find the error in the logs (hand_edit.expire_failed) and see the Field sources row."

      - alert: OutflareTransactionsFailing
        expr: sum(increase(outflare_transactions_saved_total{outcome="error"}[1h])) > 0
        labels: { severity: warning }
        annotations:
          summary: "Transactions failed to save (from the API or a billing sync, which retries): payments may be missing. See the Transactions row and the logs for the error."

      - alert: OutflareTransactionsUnconverted
        expr: max(outflare_transactions_unconverted) > 0
        for: 6h
        labels: { severity: info }
        annotations:
          summary: "Some transactions over 2 days old have no amount in their brand's currency: no exchange rate for their currency (exchange_rates.fetch failing, or a currency the European Central Bank doesn't publish). See the Transactions row."

      - alert: OutflareQueryEndpointsFailing
        expr: sum(increase(outflare_query_endpoints_calls_total{outcome="error"}[15m])) > 5
        labels: { severity: warning }
        annotations:
          summary: "Published query endpoints are failing to answer (outcome error): Query's database role, a broken saved query or the database. See the Published query endpoints row and the logs for the request ids."

      - alert: OutflareQueryEndpointsSlow
        expr: histogram_quantile(0.95, sum by (le) (rate(outflare_query_endpoints_duration_seconds_bucket[15m]))) > 10
        for: 15m
        labels: { severity: info }
        annotations:
          summary: "Published query endpoints take over 10 seconds at p95: a heavy query is published. Find it in the endpoints' call logs (duration_ms) and narrow it or lower its row cap."

      - alert: OutflareEmailsCappedMany
        expr: sum(increase(outflare_emails_guarded_total{outcome="frequency_cap"}[1h])) > 5000
        labels: { severity: info }
        annotations:
          summary: "Over 5,000 marketing emails were stopped by workspaces' frequency caps in an hour: usually a broadcast or journey that overlaps another. Each is email.capped on the person's timeline; the Marketing email guardrails row shows which sender."

      - alert: OutflareJourneyCallsFailing
        expr: |
          sum by (kind) (increase(outflare_journeys_calls_total{outcome="failed"}[30m])) > 10
          and sum by (kind) (increase(outflare_journeys_calls_total{outcome="failed"}[30m]))
            > 0.5 * sum by (kind) (increase(outflare_journeys_calls_total{outcome=~"done|skipped|failed"}[30m]))
        labels: { severity: info }
        annotations:
          summary: "Over half of journey {{ $labels.kind }} calls failed in 30 minutes. Usually one workspace's receiver changed or its key expired (each run's history says why); if it is every workspace, the engine can't reach the internet. journey_step.called failures in the logs name the journey."

      - alert: OutflareJourneyRunsBehind
        expr: max(outflare_journeys_oldest_due_seconds) > 900
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "A journey run has been due for over 15 minutes (normal is seconds): waits, wait_until checks and timeouts aren't moving on. Check journey.run jobs in the queue panels and job.failed in the logs."

      - alert: OutflareJourneyCallsSlow
        expr: histogram_quantile(0.95, sum by (kind, le) (rate(outflare_journeys_call_duration_seconds_bucket[15m]))) > 10
        for: 15m
        labels: { severity: info }
        annotations:
          summary: "Journey {{ $labels.kind }} calls take over 10 seconds at the 95th percentile (they give up at 20): a slow receiver ties up job workers. Look at the Journey webhooks, Slack, sequencers and AI steps row."

      - alert: OutflareCRMPushesFailing
        expr: |
          sum by (connector) (increase(outflare_crm_contacts_pushed_total{outcome="error"}[30m])) > 10
          and sum by (connector) (increase(outflare_crm_contacts_pushed_total{outcome="error"}[30m]))
            > 0.5 * sum by (connector) (increase(outflare_crm_contacts_pushed_total[30m]))
        labels: { severity: warning }
        annotations:
          summary: "Over half the people journeys tried to create or update in {{ $labels.connector }} in 30 minutes failed. One workspace's key expired or a step names a property the CRM doesn't have (the run's history says which); if it is every workspace, {{ $labels.connector }} is down or changed its API. journey_step.called failures with kind push_to_crm in the logs name the journey."

      - alert: OutflareAdAudienceSyncsFailing
        expr: |
          sum by (connector) (increase(outflare_ads_audience_syncs_total{outcome="error"}[30m])) > 10
          and sum by (connector) (increase(outflare_ads_audience_syncs_total{outcome="error"}[30m]))
            > 0.5 * sum by (connector) (increase(outflare_ads_audience_syncs_total[30m]))
        labels: { severity: warning }
        annotations:
          summary: "Over half the people journeys tried to add to or remove from {{ $labels.connector }} audiences in 30 minutes failed. One workspace's token lacks the permission (Meta needs ads_management and its Custom Audience terms accepted) or a step names an audience that is gone (the run's history says which); if it is every workspace, {{ $labels.connector }} is down or changed its API. journey_step.called failures with kind sync_audience in the logs name the journey."

      - alert: OutflareSequencerPushesFailing
        expr: |
          sum by (connector) (increase(outflare_sequencers_leads_pushed_total{outcome="error"}[30m])) > 10
          and sum by (connector) (increase(outflare_sequencers_leads_pushed_total{outcome="error"}[30m]))
            > 0.5 * sum by (connector) (increase(outflare_sequencers_leads_pushed_total[30m]))
        labels: { severity: warning }
        annotations:
          summary: "Over half the people journeys tried to add to {{ $labels.connector }} campaigns in 30 minutes failed. One workspace's key expired or its campaign was deleted (the run's history says why); if it is every workspace, {{ $labels.connector }} is down or changed its API. journey_step.called failures with kind push_to_sequencer in the logs name the journey."

      - alert: OutflareMailSignInsNotMoved
        expr: sum by (kind) (increase(outflare_mailboxes_sign_ins_moved_total{outcome="failed"}[1h])) > 0
        labels: { severity: warning }
        annotations:
          summary: "An older {{ $labels.kind }} mailbox sign-in could not be moved into a Gmail or Outlook connection at start-up, so its mailboxes cannot sign in. mailbox.sign_in_move_failed in the logs names the workspace and why (usually credentials sealed under a key the server no longer has); fix it and restart, or connect those mailboxes again."

      - alert: OutflareJobsDying
        expr: sum by (kind) (increase(outflare_jobs_processed_total{outcome="dead"}[15m])) > 10
        labels: { severity: warning }
        annotations:
          summary: "Jobs of kind {{ $labels.kind }} are failing for good (job.dead)."

      - alert: OutflareWebhookSignaturesFailing
        expr: sum by (connector) (increase(outflare_hooks_deliveries_total{outcome="bad_signature"}[15m])) > 20
        labels: { severity: warning }
        annotations:
          summary: "Many {{ $labels.connector }} webhook deliveries have a wrong signature: a stale signing secret on a connection, or someone posting to an address (connection_hook.received with bad_signature in the logs)."

      - alert: OutflareWebhookEventsFailing
        expr: sum by (connector) (increase(outflare_hooks_events_total{result="failed"}[30m])) > 5
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.connector }} webhook events are failing after their retries (connection_hook.event_failed in the logs). They can be replayed from Logs, Incoming webhooks."

      - alert: OutflareWebhookEventsSlow
        expr: histogram_quantile(0.95, sum by (le) (rate(outflare_hooks_handle_lag_seconds_bucket[15m]))) > 300
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "Webhook events wait over 5 minutes to be handled: workers are behind or stuck (jobs of kind hooks.handle)."

      - alert: OutflarePipelineStageBehind
        expr: max by (pipeline, stage) (outflare_pipeline_oldest_due_seconds) > 1800
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Pipeline stage {{ $labels.pipeline }}/{{ $labels.stage }} has an item waiting over 30 minutes: it can't keep up or its workers are stuck."

      - alert: OutflarePipelineErrors
        expr: |
          sum by (pipeline, stage) (rate(outflare_pipeline_items_total{outcome=~"retried|failed"}[15m]))
            / sum by (pipeline, stage) (rate(outflare_pipeline_items_total[15m])) > 0.1
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "Over 10% of items in {{ $labels.pipeline }}/{{ $labels.stage }} are retrying or failing; see \"Why items stop\"."

      - alert: OutflarePipelineItemsFailing
        expr: sum by (pipeline, stage) (increase(outflare_pipeline_items_total{outcome="failed"}[30m])) > 25
        labels: { severity: warning }
        annotations:
          summary: "Items in {{ $labels.pipeline }}/{{ $labels.stage }} are failing for good."

      - alert: OutflareBreakerOpen
        expr: sum by (account) (outflare_pipeline_breakers{state="open"}) > 0
        for: 10m
        labels: { severity: info }
        annotations:
          summary: "An outside {{ $labels.account }} account has been failing for 10 minutes and its calls are paused."

      - alert: OutflareJobsReaped
        expr: sum by (kind) (increase(outflare_jobs_reaped_total[15m])) > 0
        labels: { severity: warning }
        annotations:
          summary: "Jobs of kind {{ $labels.kind }} ran past their lease and were put back in the queue, so they may run twice."

      - alert: OutflareJobKindTakesWorkers
        expr: max by (kind) (outflare_jobs_running) > 0.5 * scalar(sum(outflare_jobs_workers))
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Jobs of kind {{ $labels.kind }} hold over half the job workers (and their database connections); other work and page loads wait. Spread that kind's jobs out or make them shorter."

      - alert: OutflareJobsReleasedAtShutdown
        expr: sum by (kind) (increase(outflare_jobs_processed_total{outcome="released"}[1h])) > 0
        labels: { severity: info }
        annotations:
          summary: "Jobs of kind {{ $labels.kind }} were still running when a shutdown's grace ended and were handed back to the queue: their handler ignores cancellation (job.released in the logs)."

      - alert: OutflareDBPoolSaturated
        expr: max(outflare_db_pool_acquired_conns / outflare_db_pool_max_conns) > 0.9
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "The engine's database pool is over 90% in use; requests queue for connections."

      - alert: OutflareDBPoolWaiting
        expr: sum(rate(outflare_db_pool_empty_acquire_wait_seconds_total[5m])) > 0.5
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Requests and jobs spend over half a second per second waiting for a database connection."

      - alert: OutflarePostgresConnectionsNearMax
        expr: max(sum without (state) (outflare_pg_connections) / outflare_pg_max_connections) > 0.8
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Postgres is over 80% of max_connections."

      - alert: OutflareLongTransaction
        expr: max(outflare_pg_longest_transaction_seconds) > 300
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "A transaction has been open for over 5 minutes; it holds locks and stops vacuum."

      - alert: OutflareDeadlocks
        expr: increase(outflare_pg_deadlocks_total[15m]) > 0
        labels: { severity: warning }
        annotations:
          summary: "Postgres detected deadlocks."

      - alert: OutflareTxRetriesGaveUp
        expr: sum(increase(outflare_db_tx_retries_total{outcome="gave_up"}[1h])) > 0
        labels: { severity: warning }
        annotations:
          summary: "A request's write lost a deadlock three times in a row and answered 500 (transactions or customer events): two senders keep locking the same people in opposite order. See Contention in the Postgres row and 'transaction retried' in the logs."

      - alert: OutflareGoroutineLeak
        expr: max(go_goroutines{job="outflare"}) > 20000
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "The engine runs over 20,000 goroutines; something is leaking."

      - alert: OutflareDatabaseGrowingFast
        # Worth a look before the volume fills: a table or index growing
        # without bound, or data that should expire not being cleaned up.
        expr: max(outflare_pg_database_bytes) > 1e9 and max(outflare_pg_database_bytes) > 1.25 * max(outflare_pg_database_bytes offset 1d)
        for: 1h
        labels: { severity: info }
        annotations:
          summary: "The database grew over 25% in a day (now {{ $value | humanize1024 }}B); check which tables grow and whether old data is cleaned up."

      - alert: OutflareMetricsQueriesFailing
        expr: max(outflare_metrics_scrape_errors) > 0
        for: 15m
        labels: { severity: info }
        annotations:
          summary: "Some database metrics can't be read; check the engine log for \"metrics query\"."

      - alert: OutflareAICallsRunaway
        # Calls run on workspaces' own keys, so a loop that keeps calling
        # spends their money. Normal use is far below this.
        expr: sum by (task) (rate(outflare_ai_calls_total[10m])) > 5
        for: 15m
        labels: { severity: critical }
        annotations:
          summary: "One tool ({{ $labels.task }}) has made over 5 AI calls a second for 15 minutes, on workspaces' own keys: check for a loop."

      - alert: OutflareAILimitsReachedSurge
        expr: sum(increase(outflare_ai_budget_alerts_total{level="100"}[1h])) > 20
        labels: { severity: warning }
        annotations:
          summary: "Over 20 AI spend limits were reached in an hour: a tool may be using far more AI than it should."

      - alert: OutflareConnectionLimitReached
        # A workspace's paid connection (Ahrefs, DataForSEO, a data
        # provider, an email verifier, Geonode) reached a usage limit its
        # admins set; they are emailed. Info only: it is working as meant.
        expr: sum(increase(outflare_connection_limits_alerts_total{level="100"}[1h])) > 0
        labels: { severity: info }
        annotations:
          summary: "A paid connection reached its daily or monthly usage limit in the last hour; its workspace's admins were emailed. See the Paid connection limits row."

      - alert: OutflareConnectionLimitStopsSurge
        # Calls refused at a limit, steadily: a feature keeps asking after
        # the limit is reached instead of stopping.
        expr: sum by (connector) (increase(outflare_connection_limits_stops_total[1h])) > 500
        for: 30m
        labels: { severity: warning }
        annotations:
          summary: "Over 500 calls an hour through {{ $labels.connector }} are being refused at a usage limit: a feature is retrying into the limit instead of stopping; check which job (engine log, usage_limit_reached)."

      - alert: OutflareQuotaChecksFailing
        # An extension's quota checker (Host.SetQuota) is failing, so the
        # engine allows the work anyway and plan limits aren't applied.
        expr: sum by (resource) (increase(outflare_quota_checks_total{outcome="error"}[15m])) > 0
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "Quota checks for {{ $labels.resource }} keep failing, so the work is allowed without the extension's limits. See quota.check_failed in the engine log for the checker's error."

      - alert: OutflareQuotaRefusalsSurge
        # Many refusals in an hour: a feature or agent keeps retrying into a
        # workspace's quota instead of stopping, or a checker refuses by
        # mistake.
        expr: sum by (resource) (increase(outflare_quota_checks_total{outcome="refused"}[1h])) > 1000
        for: 30m
        labels: { severity: info }
        annotations:
          summary: "Over 1,000 {{ $labels.resource }} quota refusals an hour: something keeps retrying past a workspace's quota, or the checker refuses by mistake. See the Quotas row."

      - alert: OutflareDomainConnectLookupsFailing
        # DNS providers' Domain Connect APIs not answering: the one-off
        # approval falls back to a Cloudflare token meanwhile.
        expr: sum(rate(outflare_domain_connect_lookups_total{outcome="lookup_failed"}[15m])) > 0.05 and sum(rate(outflare_domain_connect_lookups_total{outcome="lookup_failed"}[15m])) / sum(rate(outflare_domain_connect_lookups_total[15m])) > 0.5
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "Over half of Domain Connect lookups fail: a DNS provider's API is down or our signing key's TXT record at outflare.ai is missing; check the engine log for domain_connect."

      - alert: OutflareQueryUnavailable
        # The engine couldn't make or log in as a workspace's query role:
        # Query is off for everyone it hits.
        expr: sum(increase(outflare_query_runs_total{outcome="unavailable"}[15m])) > 0
        labels: { severity: warning }
        annotations:
          summary: "Query couldn't set up its read-only database role; check the engine log for \"query: no query role\" (the database user needs CREATEROLE)."

      - alert: OutflareQueryTypeTablesFailing
        # A brand's record types (subscription, deal) are temporary views
        # each query's connection makes; the queries still run without them.
        expr: sum(increase(outflare_query_type_tables_failed_total[30m])) > 0
        labels: { severity: warning }
        annotations:
          summary: "Brand queries are running without their record type tables: the database refused the temporary views (the query role needs the TEMP privilege); check the engine log for query.type_tables_failed."

      - alert: OutflareQueriesTimingOut
        expr: sum(rate(outflare_query_runs_total{outcome="timeout"}[15m])) / sum(rate(outflare_query_runs_total[15m])) > 0.25 and sum(increase(outflare_query_runs_total[15m])) > 20
        for: 15m
        labels: { severity: info }
        annotations:
          summary: "Over a quarter of queries are running past 15 seconds: the query views may need an index, or the database is overloaded."

      - alert: OutflareQueryExportsFailing
        # A CSV download that ran its query but failed on Outflare's side
        # (writing its query.exported activity entry, or the database).
        expr: sum(increase(outflare_query_exports_total{outcome="error"}[30m])) > 3
        labels: { severity: warning }
        annotations:
          summary: "Query Studio CSV downloads are failing on Outflare's side; check the engine log for errors on exportBrandQuery and exportSavedQuery."

      - alert: OutflareMeetingEventsBacklog
        # Meetings tied to a person are recorded as customer events every
        # minute; a backlog that stays means the loop keeps failing.
        expr: max(outflare_meeting_events_pending) > 500
        for: 30m
        labels: { severity: warning }
        annotations:
          summary: "Over 500 meetings have waited 30 minutes for their meeting.* event on people's timelines; check meeting_events.run_failed in the engine log. Booked calls don't count as conversions until it drains."

      - alert: OutflareEventInboxBehind
        # Events sent to POST /v1/brands/{brand}/events are saved, then
        # processed by the events.process job within seconds.
        expr: max(outflare_event_inbox_oldest_pending_seconds) > 300
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "A product event sent to a brand has waited over 5 minutes to be processed: the job queue is behind or events.process keeps failing (Job queue row; customer_events.process_failed in the engine log). Senders got their 202; their events are safe and wait."

      - alert: OutflareEventInboxRejecting
        # The event inbox keeps rejected events 90 days so they can be
        # fixed and replayed; most of them rejected means a sender broke.
        expr: sum(increase(outflare_event_inbox_processed_total{outcome="rejected"}[1h])) / sum(increase(outflare_event_inbox_processed_total[1h])) > 0.5 and sum(increase(outflare_event_inbox_processed_total[1h])) > 50
        for: 15m
        labels: { severity: info }
        annotations:
          summary: "Over half of the product events processed in the last hour were rejected: a sender is likely sending the wrong shape. The rejected-by-code panel says what; each brand's Events page says which source and what to fix."

      - alert: OutflareEventInboxPurgeBehind
        # Rows past their retention (30 days accepted, 90 rejected or
        # held) are deleted every ten minutes.
        expr: max(outflare_event_inbox_purge_overdue_seconds) > 21600
        for: 30m
        labels: { severity: info }
        annotations:
          summary: "Event inbox rows have stayed over 6 hours past their retention: the sweep is failing or can't keep up (customer_events.purge_failed in the engine log). Raw events are kept longer than promised until it catches up."

      - alert: OutflarePrivacyExportsFailing
        # A privacy export answers a person's request for their data; one
        # that fails for Outflare's own reasons (internal: the job kept
        # failing, or stayed pending two hours) needs someone to look.
        expr: sum(increase(outflare_privacy_exports_built_total{outcome="internal"}[1h])) > 0
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "A privacy export failed for Outflare's own reasons in the last hour (privacy_export.build_failed and job.failed for privacy_export.build in the engine log; Privacy exports panels in the event inbox row). The person's data request waits until someone asks for a new export."

      - alert: OutflareRecoveryPurgeBehind
        # Deleted customer data is purged once its 7 days in Recently
        # deleted are over; the purge runs every ten minutes.
        expr: max(outflare_recovery_purge_overdue_seconds) > 21600
        for: 30m
        labels: { severity: warning }
        annotations:
          summary: "Deleted customer data has stayed over 6 hours past its 7 days in Recently deleted: the purge is failing or can't keep up (deletion.purge_failed in the engine log; Recovery window purge panel in the event inbox row). Data people deleted is kept longer than promised until it catches up."

      - alert: OutflareConnectionsUnassigned
        # No brand, no data: a brand connection with no brand, or a site or
        # ad account nobody assigned, keeps its data out of every brand.
        expr: sum(outflare_connections_unassigned) > 0
        for: 3d
        labels: { severity: info }
        annotations:
          summary: "Connections or their sites and ad accounts have had no brand for 3 days, so their data shows in no brand (Connections and brands row; GET /v1/workspaces/{ws}/connections/unassigned lists them per workspace). Someone with integrations.manage assigns them on the Connectors page."

      - alert: OutflareConnectionsUnassignedCountMissing
        # The count runs every ten minutes on the server that serves the API.
        expr: absent(outflare_connections_unassigned)
        for: 1h
        labels: { severity: warning }
        annotations:
          summary: "The count of connections and accounts with no brand hasn't been reported for an hour: the count is failing (integration.unassigned_count_failed in the engine log) or no server runs it. The Connections and brands panel shows no data meanwhile."

      - alert: OutflareBatchUndoFailing
        # A large batch undo runs in a job; when it fails it changes
        # nothing and the batch shows undo.status failed.
        expr: sum(increase(outflare_undo_batches_total{outcome="failed"}[1h])) > 0
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "An import or ingest batch undo failed in the background in the last hour and changed nothing (job.dead for batches.undo in the engine log, with the batch id; Merges undone and batch undos panel). The person who asked sees undo failed on the batch and has to try again."

      - alert: OutflareSemanticSearchNoPgvector
        # Workspaces have meaning-based search on, but the database can't
        # store vectors, so it does nothing for them.
        expr: max(outflare_semantic_search_available) == 0 and max(outflare_semantic_search_workspaces) > 0
        for: 1h
        labels: { severity: info }
        annotations:
          summary: "Meaning-based search is on in workspaces but the database has no pgvector; add the extension (docs/workspace-search.md) or ignore if this install doesn't need it."

      - alert: OutflareEmbeddingsFailing
        expr: sum(rate(outflare_semantic_search_embed_runs_total{outcome="failed"}[30m])) / sum(rate(outflare_semantic_search_embed_runs_total[30m])) > 0.5 and sum(increase(outflare_semantic_search_embed_runs_total[30m])) > 5
        for: 30m
        labels: { severity: warning }
        annotations:
          summary: "Most embedding jobs fail; check search.embed_failed events and the engine log for the provider's error (a bad key, AI limits reached or the provider down)."

      - alert: OutflareDataNetworkWithdrawalOverdue
        # A workspace left the data network more than 30 days ago and what
        # it shared is still there: a broken promise to that customer.
        expr: max(outflare_data_network_withdrawal_overdue_seconds) > 0
        for: 15m
        labels: { severity: critical }
        annotations:
          summary: "A workspace's data network withdrawal is past its 30-day deadline; check data_network.withdrawn failures in the engine log and that the server still registers its data network."

      - alert: OutflareDataNetworkSharingBehind
        expr: max(outflare_data_network_share_lag_seconds) > 2 * 86400
        for: 1h
        labels: { severity: warning }
        annotations:
          summary: "A data network member's sends haven't been shared for over 2 days past settling; check datanetwork.share jobs and data_network.shared failures in the engine log."

      - alert: OutflareDataNetworkShareFailing
        expr: sum(increase(outflare_data_network_share_runs_total{outcome="failed"}[1h])) > 3 and sum(increase(outflare_data_network_share_runs_total{outcome="failed"}[1h])) / sum(increase(outflare_data_network_share_runs_total[1h])) > 0.5
        for: 30m
        labels: { severity: warning }
        annotations:
          summary: "Most data network sharing jobs fail; the engine log has the network's error on data_network.shared."

      - alert: OutflareDataNetworkLookupErrors
        expr: sum(increase(outflare_data_network_lookups_total{outcome="error"}[30m])) > 20 and sum(increase(outflare_data_network_lookups_total{outcome="error"}[30m])) / sum(increase(outflare_data_network_lookups_total[30m])) > 0.25
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "Over a quarter of data network lookups fail; the email finder carries on without the network. Check data_network.lookup_failed in the engine log."

      - alert: OutflareDataNetworkProbing
        # Many lookups refused at one domain's daily limit: someone may be
        # guessing names at a company.
        expr: sum(increase(outflare_data_network_lookups_total{outcome="refused_limit"}[1h])) > 500
        for: 15m
        labels: { severity: info }
        annotations:
          summary: "Over 500 data network lookups an hour hit a domain's daily limit; look at data_network.lookup_refused events by workspace for someone guessing names."

      - alert: OutflareKnowledgeAnswersFailing
        # Questions asked of the knowledge base end in an error rather
        # than an answer: the AI providers are failing or rejecting keys.
        expr: sum(rate(outflare_knowledge_asks_total{outcome="error"}[30m])) / sum(rate(outflare_knowledge_asks_total[30m])) > 0.5 and sum(increase(outflare_knowledge_asks_total[30m])) > 5
        for: 30m
        labels: { severity: warning }
        annotations:
          summary: "Most questions asked of the knowledge base fail; check knowledge.answer_failed events and the engine log for the provider's error (a bad key, AI limits reached or the provider down)."

      - alert: OutflareKnowledgeAnswersSlow
        expr: histogram_quantile(0.95, sum by (le) (rate(outflare_knowledge_ask_seconds_bucket[30m]))) > 20 and sum(increase(outflare_knowledge_asks_total[30m])) > 5
        for: 30m
        labels: { severity: info }
        annotations:
          summary: "Answers from the knowledge base take over 20 seconds at the 95th percentile; the AI providers are slow, or the workspaces' Knowledge answers model is a slow one (Settings, AI model)."

      - alert: OutflareKnowledgeSuggestionsFailing
        # Turning teammates' support replies into suggested answers keeps
        # failing: the review queue stops filling from support.
        expr: sum(increase(outflare_knowledge_suggestions_total{outcome="error"}[1h])) > 5 and sum(increase(outflare_knowledge_suggestions_total{outcome="error"}[1h])) > sum(increase(outflare_knowledge_suggestions_total{outcome=~"created|not_reusable"}[1h]))
        for: 30m
        labels: { severity: warning }
        annotations:
          summary: "Most support replies fail to become suggested answers; check knowledge.reply_captured failures and knowledge.from_reply job errors in the engine log (the provider's error, or AI limits reached)."

      - alert: OutflareHelpCentreErrors
        # Public help centre pages failing: usually the database.
        expr: sum(increase(outflare_help_centre_requests_total{outcome="error"}[15m])) > 10 and sum(increase(outflare_help_centre_requests_total{outcome="error"}[15m])) / sum(increase(outflare_help_centre_requests_total[15m])) > 0.05
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Over 5% of public help centre pages fail; look for internal errors on /h/ routes in the engine log (usually the database)."

      - alert: OutflareHelpCentreViewsNotCounted
        expr: sum(increase(outflare_help_centre_requests_total{outcome="count_failed"}[30m])) > 20
        for: 15m
        labels: { severity: info }
        annotations:
          summary: "Help centre views, searches or unanswered searches aren't being stored; readers still see the pages. Look for \"help centre view not counted\" in the engine log."

      - alert: OutflareHelpCentreSlow
        expr: histogram_quantile(0.95, sum by (le) (rate(outflare_help_centre_render_seconds_bucket[15m]))) > 1 and sum(increase(outflare_help_centre_requests_total[15m])) > 50
        for: 15m
        labels: { severity: info }
        annotations:
          summary: "Help centre pages take over a second to build at the 95th percentile; a workspace with very many public articles, or a slow database."

      - alert: OutflareSupportRepliesFailing
        # Replies to customers aren't going out: the support mailboxes'
        # servers refuse them, or the mailboxes were paused or removed.
        expr: sum(rate(outflare_support_replies_total{outcome="failed"}[30m])) / sum(rate(outflare_support_replies_total{outcome=~"sent|failed"}[30m])) > 0.25 and sum(increase(outflare_support_replies_total{outcome=~"sent|failed"}[30m])) > 3
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "Over a quarter of support replies fail to send; check support.reply_failed events and the engine log (\"support reply not sent\") for the mailbox's error, and the support mailboxes' status."

      - alert: OutflareSupportRepliesBacklog
        expr: max(outflare_jobs_oldest_due_seconds{kind="support.send"}) > 300
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "A support reply has waited over 5 minutes for a worker; customers are waiting on answers the team already wrote. Check the job queue row for busy or stuck workers."

      - alert: OutflareSupportRepliesSlow
        expr: histogram_quantile(0.95, sum by (le) (rate(outflare_support_reply_seconds_bucket[30m]))) > 20 and sum(increase(outflare_support_replies_total[30m])) > 5
        for: 30m
        labels: { severity: info }
        annotations:
          summary: "Support replies take over 20 seconds to send at the 95th percentile; the support mailboxes' mail servers are slow to accept mail."

      - alert: OutflareSupportSLACheckFailing
        # The check that marks missed SLA targets keeps failing: overdue
        # conversations aren't flagged and support.sla_breached isn't sent.
        expr: sum(increase(outflare_support_sla_checks_total{outcome="error"}[15m])) > 3
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "The support SLA check keeps failing, so missed replies and resolutions aren't flagged; look for support.sla_check_failed in the engine log."

      - alert: OutflareSupportSLACheckStopped
        expr: sum(increase(outflare_support_sla_checks_total[15m])) < 1
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "The support SLA check hasn't run in 15 minutes; check that a worker process (role all or worker) is running."

      - alert: OutflareSupportChatFailing
        # Website chats erroring: visitors can't send messages or see replies.
        expr: sum(rate(outflare_support_chat_requests_total{outcome="error"}[15m])) / sum(rate(outflare_support_chat_requests_total[15m])) > 0.05 and sum(increase(outflare_support_chat_requests_total{outcome="error"}[15m])) > 5
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Over 5% of website chat requests fail; visitors may not reach support. Look for support.chat_failed and errors on /chat/ in the engine log."

      - alert: OutflareSupportChatLimited
        expr: sum(increase(outflare_support_chat_requests_total{outcome="limited"}[15m])) > 300
        for: 15m
        labels: { severity: info }
        annotations:
          summary: "Many website chat requests are rate limited; a busy site behind one network, or someone flooding a chat. See the Support inbox row's refused panel."

      - alert: OutflareSupportSLACheckSlow
        expr: histogram_quantile(0.95, sum by (le) (rate(outflare_support_sla_check_seconds_bucket[30m]))) > 5
        for: 30m
        labels: { severity: info }
        annotations:
          summary: "One support SLA check takes over 5 seconds at the 95th percentile; many conversations fall due at once, or the database is slow. See the Support inbox row."

      - alert: OutflareSupportAssistantFailing
        # The support assistant's AI calls keep breaking: customers' messages
        # get no draft and go to a person.
        expr: sum(increase(outflare_support_assistant_runs_total{action="failed"}[30m])) > 5 and sum(rate(outflare_support_assistant_runs_total{action="failed"}[30m])) / sum(rate(outflare_support_assistant_runs_total[30m])) > 0.2
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "Over 20% of support assistant runs fail, so customers' messages get no draft; look for support.assistant_failed in the engine log (often a workspace's AI provider erroring)."

      - alert: OutflareSupportAssistantSlow
        expr: histogram_quantile(0.95, sum by (le) (rate(outflare_support_assistant_seconds_bucket[30m]))) > 45 and sum(increase(outflare_support_assistant_runs_total[30m])) > 5
        for: 30m
        labels: { severity: info }
        annotations:
          summary: "The support assistant takes over 45 seconds to decide at the 95th percentile; AI providers are slow or the job queue is busy. See the Support assistant row."

      - alert: OutflareKnowledgeAnswerSearchFailing
        # Searching the website and Slack for answers the knowledge lacks
        # keeps failing: no suggestions reach the review queue.
        expr: sum(increase(outflare_knowledge_answer_searches_total{outcome="error"}[1h])) > 5 and sum(increase(outflare_knowledge_answer_searches_total{outcome="error"}[1h])) > sum(increase(outflare_knowledge_answer_searches_total{outcome=~"found|none"}[1h]))
        for: 30m
        labels: { severity: warning }
        annotations:
          summary: "Most searches of websites and Slack for missing support answers fail, so nothing is suggested in Knowledge; look for knowledge.answer_searched errors in the engine log (a Slack connection that lost access, or an AI provider erroring)."

      - alert: OutflareKnowledgeWebsiteImportsFailing
        expr: sum(increase(outflare_knowledge_website_imports_total{outcome="failed"}[6h])) > 3 and sum(increase(outflare_knowledge_website_imports_total{outcome="failed"}[6h])) > sum(increase(outflare_knowledge_website_imports_total{outcome="done"}[6h]))
        for: 30m
        labels: { severity: info }
        annotations:
          summary: "Most website imports into knowledge fail; look for knowledge.website_import_failed in the engine log (sites refusing OutflareBot, or the fetcher unable to reach the internet)."

      - alert: OutflareKnowledgeWebsiteRechecksBroken
        # The daily re-check of imported websites can't queue its runs.
        expr: sum(increase(outflare_knowledge_website_rechecks_total{outcome="error"}[3h])) > 2
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "The daily website re-check keeps failing, so knowledge from websites goes stale; look for knowledge.website_recheck_failed in the engine log."

      - alert: OutflareKnowledgeReplyLearningFailing
        # Learning answers from past support replies fails more than it works.
        expr: sum(increase(outflare_knowledge_reply_learning_total{outcome="failed"}[6h])) > 3 and sum(increase(outflare_knowledge_reply_learning_total{outcome="failed"}[6h])) > sum(increase(outflare_knowledge_reply_learning_total{outcome="done"}[6h]))
        for: 30m
        labels: { severity: info }
        annotations:
          summary: "Most runs that learn answers from past support replies fail; look for knowledge.reply_learning_failed in the engine log (workspaces' AI keys or budgets, or the AI provider)."

      - alert: OutflareSupportHeldRepliesRefused
        # Held Auto email replies that the send refused when their hold ended.
        expr: sum(increase(outflare_support_assistant_held_total{result="refused"}[1h])) > 5 and sum(increase(outflare_support_assistant_held_total{result="refused"}[1h])) > sum(increase(outflare_support_assistant_held_total{result="sent"}[1h]))
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "Most held Auto email replies are refused when their hold ends and stay as drafts; look for 'support assistant auto send refused' in the engine log (mailbox or sending policy)."

      - alert: OutflareAdConversionsFailing
        # Ad platforms refusing conversions sent back: a sign-in, token or
        # conversion action changed at the platform.
        expr: sum by (connector) (increase(outflare_ad_conversions_total{outcome="failed"}[30m])) > 20 and sum by (connector) (increase(outflare_ad_conversions_total{outcome="failed"}[30m])) / sum by (connector) (increase(outflare_ad_conversions_total{outcome=~"sent|failed"}[30m])) > 0.25
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "Over a quarter of conversions sent to {{ $labels.connector }} fail; the send log (Paid ads, or GET .../ads/conversion-sends?status=failed) has the platform's reason, and ad_conversions.sent failures carry the error code."

      - alert: OutflareAdConversionAdjustmentsFailing
        # Refunds not reaching the ad platform: conversion adjustments it
        # refused on every try, so bidding still counts refunded revenue.
        expr: sum by (connector) (increase(outflare_ad_conversion_adjustments_total{outcome="failed"}[6h])) > 5
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "Refunds sent to {{ $labels.connector }} as conversion adjustments keep failing; the engine log for ad_conversions.adjusted has the platform's reason (often the conversion action doesn't allow adjustments, or the conversion was sent without an order id)."

      - alert: OutflareAdConversionsBehind
        # Conversions queued but not sent: the sender loop or its jobs are
        # not running, or a platform is unreachable.
        expr: max(outflare_ad_conversions_oldest_queued_seconds) > 1800
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "A conversion has waited over 30 minutes to go to its ad platform; check the jobs queue for ads.conversions_send and the engine log for ad_conversions."

      - alert: OutflareAdsFeedSendsFailing
        # Google refusing conversions sent through the conversion feed
        # (Data Manager, or the Ads API fallback): a bad row shape, a
        # conversion action removed, or an account that cannot use the
        # feed at all.
        expr: sum by (transport) (increase(outflare_ads_feed_sends_total{outcome="failed"}[1h])) > 20 and sum by (transport) (increase(outflare_ads_feed_sends_total{outcome="failed"}[1h])) / sum by (transport) (increase(outflare_ads_feed_sends_total[1h])) > 0.25
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "Over a quarter of conversions sent through the {{ $labels.transport }} feed fail; the send log (GET .../ads/conversion-sends?status=failed) has Google's reason per row, and the Paid media (conversion feed) row the batches by outcome."

      - alert: OutflareAdsFeedFallingBack
        # Accounts being turned away from the Data Manager API: the
        # destination is not allowlisted, the sign-in lacks the scope, or
        # the API is not enabled on the server's Cloud project. Sends fall
        # back to the Ads API, which Google closes to new integrations.
        expr: sum(increase(outflare_ads_feed_batches_total{transport="data_manager", outcome="refused"}[6h])) > 0
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "The Data Manager API refused an account's destination and its sends fell back to the Ads API; GET .../ads/accounts/{id}/feed shows transport_reason, and ad_feed.transport_changed events name the account."

      - alert: OutflarePayersListRefreshFailing
        # The daily refresh of the paying customers lists keeps failing,
        # so Google's new customer goal reads a stale list of existing
        # customers.
        expr: sum(increase(outflare_ads_feed_batches_total{transport="payers_list", outcome="failed"}[24h])) > 2
        for: 30m
        labels: { severity: warning }
        annotations:
          summary: "Refreshing the paying customers lists on Google Ads failed more than twice in a day; ad_payers.refreshed failures carry the error code, and GET .../ads/accounts/{id}/feed shows payers_list.error."

      - alert: OutflarePartnerRewardsBehind
        # Rewards past their hold aren't being approved: the approver loop
        # is stuck or failing, so partners' balances and action webhooks lag.
        expr: max(outflare_partners_rewards_overdue_seconds) > 1800
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "A partner reward has waited over 30 minutes past its hold to be approved; check the engine log and partner_reward.approve_failed events for the error."

      - alert: OutflarePartnerConversionsFailing
        # Our errors (not bad input) recording conversions from workspaces'
        # backends: they retry, but referred sales go uncredited meanwhile.
        expr: sum(increase(outflare_partners_conversions_total{outcome="error"}[15m])) > 5
        for: 10m
        labels: { severity: critical }
        annotations:
          summary: "Partner conversions are failing with server errors; check the engine log for partner-conversions and partner-postbacks requests (api.called events with error_code internal)."

      - alert: OutflarePartnerClicksNotStored
        # Visitors still land, but clicks (and the click ids conversions use)
        # are lost.
        expr: sum(increase(outflare_partners_clicks_total{outcome="error"}[15m])) > 20
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Partner link clicks aren't being stored (visitors still land); check the engine log for 'partners: store click'."

      - alert: OutflarePartnerPostbacksFailing
        # Partners' own trackers are often down; most failing at once more
        # likely means this server can't reach the internet.
        expr: |
          sum(increase(outflare_partners_postbacks_total{outcome=~"unreachable|retried"}[1h])) > 10
          and
          sum(increase(outflare_partners_postbacks_total{outcome=~"unreachable|retried"}[1h]))
            > sum(increase(outflare_partners_postbacks_total{outcome="sent"}[1h]))
        for: 30m
        labels: { severity: info }
        annotations:
          summary: "Over half of partner postbacks have failed or been retried for an hour; check partner.postback_failed events and whether this server can reach outside addresses (egress, DNS)."

      - alert: OutflarePartnerImportsFailing
        # Imports run around a workspace's switch-over day; several failing
        # at once is more than one workspace's key or program.
        expr: sum(increase(outflare_partners_imports_total{outcome="failed"}[1h])) > 3
        labels: { severity: info }
        annotations:
          summary: "Several partner imports from Tolt failed in the last hour; check partner_import.failed events for their error codes and the engine log for 'partner import'. A change in Tolt's API shows as many at once."

      - alert: OutflarePartnerImportKindsUnreadable
        # A kind Tolt answers with something the import can't read is left
        # out; the same kind in several imports means Tolt changed a list.
        expr: sum by (kind) (increase(outflare_partners_import_objects_total{result="unreadable"}[6h])) > 2
        labels: { severity: warning }
        annotations:
          summary: "Partner imports could not read the same kind from Tolt several times in 6 hours; check partner_import.kind_skipped events and the engine log ('tolt answer') for the status, content type and keys Tolt sent."

      - alert: OutflareReviewPagesNotRead
        # Pages are read once a day and a failed read is tried again the
        # same day; two days with no read ending, read or failed, on a page
        # with a connected page reader means the hourly scheduler or the
        # reviews.read jobs are stuck. Pages that keep failing are
        # OutflareReviewPageReadsFailing and outflare_reviews_stuck_pages.
        expr: max by (platform) (outflare_reviews_oldest_read_seconds) > 48 * 3600
        for: 1h
        labels: { severity: warning }
        annotations:
          summary: "No read of a review page ({{ $labels.platform }}) has ended, read or failed, for over two days; check the reviews.read jobs and the engine log for reviews.scheduler_failed."

      - alert: OutflareReviewPageReadsFailing
        # pending (a page still being read, picked up next round) is no failure.
        expr: sum(rate(outflare_reviews_page_reads_total{outcome!~"success|pending"}[6h])) / sum(rate(outflare_reviews_page_reads_total[6h])) > 0.5 and sum(increase(outflare_reviews_page_reads_total[6h])) > 20
        for: 1h
        labels: { severity: warning }
        annotations:
          summary: "Over half of review page reads fail: a review site may have changed its page or started blocking reads; check the review_page.read_failed events by platform and error code."

      - alert: OutflarePricingPagesNotRead
        # Pages are read once a week and a failed read is tried again the
        # next day; nine days with no read ending, read or failed, on a
        # page with a connected page reader means the hourly scheduler or
        # the pricing.read jobs are stuck.
        expr: max(outflare_pricing_oldest_read_seconds) > 9 * 24 * 3600
        for: 1h
        labels: { severity: warning }
        annotations:
          summary: "No read of a pricing page has ended, read or failed, for over nine days; check the pricing.read jobs and the engine log for pricing.scheduler_failed."

      - alert: OutflarePricingPageReadsFailing
        # blocked (a bot check) is the page reader's to get past and is
        # left out; no_prices_found over half the time means the price
        # finder misses a common layout.
        expr: sum(rate(outflare_pricing_page_reads_total{outcome!~"success|blocked"}[1d])) / sum(rate(outflare_pricing_page_reads_total[1d])) > 0.5 and sum(increase(outflare_pricing_page_reads_total[1d])) > 20
        for: 1h
        labels: { severity: warning }
        annotations:
          summary: "Over half of pricing page reads fail; check the pricing_page.read_failed events by error code (no_prices_found means the price finder in engine/internal/pricing misses the pages' layout)."

      - alert: OutflareNewsSearchesOverdue
        # Searches are queued every minute once due; one an hour late
        # means the scheduler or the news.run jobs are stuck.
        expr: max(outflare_news_search_overdue_seconds) > 3600
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "A news search is over an hour past its time; check the news.run jobs and the engine log for news.scheduler_failed."

      - alert: OutflareNewsSearchRunsFailing
        # Missing connections and usage limits are the workspace's to fix,
        # so only provider and internal failures count.
        expr: sum(rate(outflare_news_search_runs_total{outcome=~"connector_error|internal"}[6h])) / sum(rate(outflare_news_search_runs_total[6h])) > 0.5 and sum(increase(outflare_news_search_runs_total[6h])) > 20
        for: 1h
        labels: { severity: warning }
        annotations:
          summary: "Over half of news search runs fail with a provider or internal error; check the news_search.run_failed events by error code and the engine log."
      - alert: OutflareReviewPagesStuck
        # A page that failed 3 reads in a row, retries included, with an
        # error Outflare has to fix: the site changed its page (the parser in
        # engine/internal/reviews/parse.go), the page is slower than the page
        # reader allows, the page reader failed with a code Outflare doesn't
        # sort yet (page_failed), or the read couldn't be saved. A site that blocks
        # the page reader (blocked) is the reader's to get past, not
        # Outflare's, and errors a workspace fixes itself (its key, quota, a
        # wrong address) show on its Reviews page instead; neither alerts.
        expr: sum by (platform, code) (outflare_reviews_stuck_pages{code=~"not_a_review_page|slow_page|page_failed|save_failed|unknown"}) > 0
        for: 30m
        labels: { severity: warning }
        annotations:
          summary: "Review pages on {{ $labels.platform }} keep failing ({{ $labels.code }}) after retries; check the review_page.read_failed events and the engine log for that platform, then fix the parser (engine/internal/reviews) or how the page is read."

      - alert: OutflareReviewSavesFailing
        # A page was read but what it showed couldn't be kept: a bug, not
        # the site.
        expr: sum(increase(outflare_reviews_page_reads_total{outcome="save_failed"}[1h])) > 0
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Review page reads were fetched but couldn't be saved in the last hour; search the engine log for review_page.read_failed with error_code save_failed."

      - alert: OutflareSocialAccountsStuck
        # An account that failed 3 reads in a row, same-day retries included,
        # with an error Outflare has to fix: the profile page changed (the
        # parser in engine/internal/sociallinks), the page is slower than
        # the page reader allows, or the read couldn't be saved. A site that
        # blocks the page reader (blocked) is the reader's to get past, not
        # Outflare's, and errors a workspace fixes itself (its key, credits,
        # a wrong address) show on its Social page instead; neither alerts.
        # Each missed day is a gap in follower growth.
        expr: sum by (channel, code) (outflare_social_stuck_accounts{code=~"slow_page|page_failed|no_follower_count|save_failed|unknown"}) > 0
        for: 30m
        labels: { severity: warning }
        annotations:
          summary: "Social accounts on {{ $labels.channel }} keep failing ({{ $labels.code }}) after retries; check the social_account.sync_failed events and the engine log for that channel, then fix the profile parser (engine/internal/sociallinks) or how the page is read."

      - alert: OutflareSyncsStuck
        # A connection's scheduled sync (analytics, Search Console, page
        # conversions, ads, SEO snapshots, SEO site reads, news searches)
        # failed 3 runs in a row, retries
        # included, with an error that isn't the workspace's to fix:
        # Outflare's own (internal), or the provider failing for hours.
        # Refused keys, spent quotas and budgets show on the connection
        # instead and don't alert.
        expr: sum by (module, code) (outflare_sync_stuck{code=~"internal|connector_unavailable|unknown"}) > 0
        for: 1h
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.module }} syncs keep failing ({{ $labels.code }}) after retries; check the engine log and the sync_failed events for that module (internal is Outflare's own bug)."

      - alert: OutflareSyncRunsBroken
        # A sync run failed on Outflare's side: a bug, not the provider.
        expr: sum by (module) (increase(outflare_sync_runs_total{outcome="internal"}[1h])) > 0
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.module }} sync runs failed on Outflare's side in the last hour; search the engine log for that module's sync errors with error_code internal."

      - alert: OutflareSocialReadsFailing
        expr: sum(rate(outflare_social_account_reads_total{outcome!="success"}[6h])) / sum(rate(outflare_social_account_reads_total[6h])) > 0.5 and sum(increase(outflare_social_account_reads_total[6h])) > 20
        for: 1h
        labels: { severity: warning }
        annotations:
          summary: "Over half of social account reads fail: a channel may have changed its profile page or started blocking reads; check the social_account.sync_failed events by channel and error code."

      - alert: OutflareNewsArticleReadsFailing
        # Sites saying no (blocked, opted_out) and gone pages are normal;
        # unreachable and failed reads climbing mean OutflareBot or its
        # network is in trouble.
        expr: sum(rate(outflare_news_article_reads_total{status=~"unreachable|failed"}[6h])) / sum(rate(outflare_news_article_reads_total[6h])) > 0.5 and sum(increase(outflare_news_article_reads_total[6h])) > 20
        for: 1h
        labels: { severity: warning }
        annotations:
          summary: "Over half of news article reads fail to reach the page; check the news_article.read events by error code and OutflareBot's crawl metrics."

      - alert: OutflareQuoteApprovalEmailsFailing
        # Experts aren't getting the emails asking them to approve quotes:
        # their outreach sequences' mailboxes can't deliver them.
        expr: sum(increase(outflare_stories_quote_approval_emails_total{outcome=~"failed|bounced"}[6h])) > 3 and sum(increase(outflare_stories_quote_approval_emails_total{outcome=~"failed|bounced"}[6h])) / sum(increase(outflare_stories_quote_approval_emails_total[6h])) > 0.5
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "Over half of quote approval emails fail or bounce in their outreach sequences; check story_quote.approval_send_failed events (error_code send_failed) and the sequences' mailboxes on the Sending rows. People can still copy the link instead."

      - alert: OutflareQuoteApprovalPageErrors
        expr: sum(increase(outflare_stories_quote_approval_pages_total{outcome="error"}[30m])) > 5
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "The public quote approval page is failing (internal errors on /quote-approval/), so experts can't approve their quotes; look for internal errors on that route in the engine log (usually the database)."

      - alert: OutflareStoryAIFailing
        # A workspace without a model or past its budget is its own to fix;
        # ai_failed and connector_auth climbing mean the AI calls themselves
        # break.
        expr: sum(rate(outflare_news_story_ai_runs_total{outcome=~"ai_failed|connector_auth"}[6h])) / sum(rate(outflare_news_story_ai_runs_total[6h])) > 0.5 and sum(increase(outflare_news_story_ai_runs_total[6h])) > 10
        for: 1h
        labels: { severity: warning }
        annotations:
          summary: "Over half of the AI's story work (ideas, release drafts, pitch openers, reading journalists' replies) fails at the AI call; check the story.ideas_failed, story.draft_failed, story_pitch.write_failed and story_pitch.reply_failed events by error code."

      - alert: OutflareSocialPostsOverdue
        # Approved posts go out within a minute or two of their time; one
        # 10 minutes late means the social scheduler or the social.publish
        # jobs are stuck.
        expr: max by (channel) (outflare_social_publication_overdue_seconds) > 600
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "An approved {{ $labels.channel }} post is over 10 minutes past its time; check the social.publish jobs and the engine log for social.scheduler_failed."

      - alert: OutflareSocialPostsFailing
        expr: sum by (channel) (increase(outflare_social_publishes_total{outcome="failed"}[1h])) > 5
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "Over 5 {{ $labels.channel }} posts failed in an hour: the channel may have changed its API or be down; check the social_publication.publish_failed events by error code."

      - alert: OutflareRedditSendsFailing
        expr: sum(increase(outflare_reddit_sends_total{outcome=~"failed|unknown"}[1h])) > 5
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "Over 5 Reddit campaign actions failed to reach Engain in an hour: Engain may be down or have changed its API; check the reddit_action.send_failed events by error code."

      - alert: OutflareRedditChecksFailing
        expr: sum(rate(outflare_reddit_checks_total{outcome!="ok"}[6h])) / sum(rate(outflare_reddit_checks_total[6h])) > 0.5 and sum(increase(outflare_reddit_checks_total[6h])) > 20
        for: 1h
        labels: { severity: warning }
        annotations:
          summary: "Over half of Reddit campaign checks failed in 6 hours: Reddit may be turning the reader away or Engain not answering; check reddit_action.check_failed events and whether workspaces have Geonode connected."

      - alert: OutflareLinkReadsFailing
        # budget_reached is a workspace's own limit doing its job, not a
        # fault, so it is left out.
        expr: sum(rate(outflare_seo_link_reads_total{outcome!~"success|budget_reached"}[6h])) / sum(rate(outflare_seo_link_reads_total[6h])) > 0.5 and sum(increase(outflare_seo_link_reads_total[6h])) > 10
        for: 1h
        labels: { severity: warning }
        annotations:
          summary: "Over half of link reads (who links to a page) fail: Ahrefs or DataForSEO may be failing or have changed their links API; check link_reads.weekly_failed events and api.called for readLinks by error code."

      - alert: OutflareLinkPageChecksFailing
        # Other people's sites being down, gone or blocking OutflareBot is
        # normal; failed is a check that broke.
        expr: sum(rate(outflare_seo_link_page_checks_total{status="failed"}[6h])) / sum(rate(outflare_seo_link_page_checks_total[6h])) > 0.5 and sum(increase(outflare_seo_link_page_checks_total[6h])) > 20
        for: 1h
        labels: { severity: warning }
        annotations:
          summary: "Over half of link prospect page checks fail: check link_prospect.check_failed in the engine log and the link_prospects.check jobs."

      - alert: OutflareArchiveLookupsFailing
        expr: sum(rate(outflare_seo_archive_lookups_total{outcome="error"}[6h])) / sum(rate(outflare_seo_archive_lookups_total[6h])) > 0.5 and sum(increase(outflare_seo_archive_lookups_total[6h])) > 20
        for: 1h
        labels: { severity: info }
        annotations:
          summary: "Over half of Internet Archive lookups fail: archive.org may be down or refusing; page checks go on without snapshots."

      - alert: OutflareLinkPitchOpenersFailing
        # no_ai and ai_unavailable are workspaces without AI or over their
        # limit; ai_failed is the model's answer breaking.
        expr: sum(rate(outflare_seo_link_pitches_written_total{outcome="ai_failed"}[6h])) / sum(rate(outflare_seo_link_pitches_written_total[6h])) > 0.5 and sum(increase(outflare_seo_link_pitches_written_total[6h])) > 10
        for: 1h
        labels: { severity: warning }
        annotations:
          summary: "Over half of link pitch openers fail to be written: check the link_pitches.write jobs and the AI usage page's link_pitches tool for a model or prompt change."

      - alert: OutflareLinkPitchesHeldByCap
        # Pitches past a sequence's daily limit go out on later days; this
        # fires when far more wait than go out, so they pile up.
        expr: sum(increase(outflare_seo_link_pitches_auto_total{outcome="daily_cap"}[24h])) > 3 * sum(increase(outflare_seo_link_pitches_auto_total{outcome="sent"}[24h])) and sum(increase(outflare_seo_link_pitches_auto_total{outcome="daily_cap"}[24h])) > 50
        for: 6h
        labels: { severity: info }
        annotations:
          summary: "Link pitches wait behind sequences' daily limits three times faster than they go out: playbooks find more than the limits send. Nothing is lost; the workspace may want a higher auto_send_per_day or fewer link playbooks."

      - alert: OutflareLinkRepliesFailing
        expr: sum(rate(outflare_seo_link_replies_read_total{kind="ai_failed"}[6h])) / sum(rate(outflare_seo_link_replies_read_total[6h])) > 0.5 and sum(increase(outflare_seo_link_replies_read_total[6h])) > 10
        for: 1h
        labels: { severity: warning }
        annotations:
          summary: "Over half of replies to link pitches can't be read by the AI: prospects stay at replied for a person to move; check the link_pitches.read_reply jobs."

      - alert: OutflareLinkLiveChecksUnreachable
        expr: sum(rate(outflare_seo_link_live_checks_total{outcome="unreachable"}[6h])) / sum(rate(outflare_seo_link_live_checks_total[6h])) > 0.5 and sum(increase(outflare_seo_link_live_checks_total[6h])) > 20
        for: 2h
        labels: { severity: info }
        annotations:
          summary: "Over half of checks of agreed and live links can't reach the page: OutflareBot may be blocked or the page checks broken; check link_prospect.check_failed and link_live.schedule_failed in the engine log."

      - alert: OutflareWebSearchesFailing
        # budget_reached is a workspace's own limit working as meant.
        expr: sum(rate(outflare_seo_web_searches_total{outcome!~"done|budget_reached"}[6h])) / sum(rate(outflare_seo_web_searches_total[6h])) > 0.5 and sum(increase(outflare_seo_web_searches_total[6h])) > 10
        for: 1h
        labels: { severity: warning }
        annotations:
          summary: "Over half of web searches (search-results) fail for reasons other than a budget: DataForSEO's or Geonode's search API may be failing or have changed; check api.called for readSearchResults by error code."

      - alert: OutflareAIScreenAnswersFailing
        # budget_reached is a workspace's own limit working as meant.
        expr: sum(rate(outflare_ai_visibility_screen_answers_total{outcome!~"done|budget_reached"}[6h])) / sum(rate(outflare_ai_visibility_screen_answers_total[6h])) > 0.5 and sum(increase(outflare_ai_visibility_screen_answers_total[6h])) > 10
        for: 1h
        labels: { severity: warning }
        annotations:
          summary: "Over half of AI visibility answers read from ChatGPT's and Gemini's own screens fail for reasons other than a budget: DataForSEO's LLM Scraper may be failing or have changed; check ai_sample.failed events by error code and provider dataforseo."

      - alert: OutflareAIDemandReadsFailing
        # budget_reached is a workspace's own limit working as meant.
        expr: sum(rate(outflare_ai_visibility_demand_reads_total{outcome!~"done|budget_reached"}[6h])) / sum(rate(outflare_ai_visibility_demand_reads_total[6h])) > 0.5 and sum(increase(outflare_ai_visibility_demand_reads_total[6h])) > 5
        for: 1h
        labels: { severity: info }
        annotations:
          summary: "Over half of reads of what people ask AI assistants fail for reasons other than a budget: DataForSEO's LLM Mentions or AI keyword data may be failing or have changed; check ai_prompt.demand_failed events by error code."

      - alert: OutflareAIStanceReadsFailing
        # skipped and ai_model_needed are a workspace's own settings working as meant.
        expr: sum(rate(outflare_ai_visibility_stance_reads_total{outcome=~"ai_failed|refused|provider_error|provider_auth|timeout"}[6h])) / sum(rate(outflare_ai_visibility_stance_reads_total[6h])) > 0.5 and sum(increase(outflare_ai_visibility_stance_reads_total[6h])) > 10
        for: 1h
        labels: { severity: info }
        annotations:
          summary: "Over half of AI visibility answers can't be read for how they treat the brands they name: the reader's answers may not parse or a provider is failing; check ai_stance.failed events by error code."

      - alert: OutflareAIPromptDraftsFailing
        # Budgets and missing models are a workspace's own settings working as meant.
        expr: sum(rate(outflare_ai_visibility_prompt_drafts_total{outcome=~"ai_failed|connector_auth"}[6h])) / sum(rate(outflare_ai_visibility_prompt_drafts_total[6h])) > 0.5 and sum(increase(outflare_ai_visibility_prompt_drafts_total[6h])) > 5
        for: 1h
        labels: { severity: info }
        annotations:
          summary: "Over half of AI visibility question drafts fail: the drafting prompt's answers may not parse or a provider is failing; check ai_prompt.draft_failed events by error code."

      - alert: OutflarePlaybookAutomationsFailing
        # held and capped are limits working as meant; failed retries in 15 minutes.
        expr: sum(increase(outflare_playbooks_automation_runs_total{outcome="failed"}[1h])) > 3 and sum(increase(outflare_playbooks_automation_runs_total{outcome="started"}[1h])) == 0
        for: 30m
        labels: { severity: warning }
        annotations:
          summary: "Playbook automations keep failing to start runs and none started in the last hour: check playbook_automation.run_failed in the engine log (usually the database or the agent_runs table)."

      - alert: OutflarePlaybookAutomationsBehind
        expr: max(outflare_playbooks_automation_lag_seconds) > 900
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "An active playbook automation is over 15 minutes past its run time: the automation loop (RunAutomations) is stuck or slow; check playbook_automation.runner_failed in the engine log."

      - alert: OutflareInboundEmailBadSignatures
        # The operator's edge (Outflare Cloud's mail receiver) signs every
        # delivery; refusals mean the two disagree on the secret, so
        # workspaces' forwarded mail is being lost.
        expr: sum(increase(outflare_inbound_email_received_total{outcome="bad_signature"}[15m])) > 5
        for: 15m
        labels: { severity: critical }
        annotations:
          summary: "Inbound email deliveries are refused for a bad signature: the mail receiver and the engine have different inbound secrets, and forwarded mail (support, AI receipts) is lost until they match."

      - alert: OutflareInboundEmailFailing
        expr: sum(increase(outflare_inbound_email_processed_total{status="failed"}[30m])) > 5
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "Inbound messages keep failing to be processed (retried): check inbound_email.process_failed in the engine log and the inbound.process jobs."

      - alert: OutflareInboundEmailErrors
        expr: sum(increase(outflare_inbound_email_received_total{outcome="error"}[15m])) > 5
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "Inbound email deliveries fail on Outflare's side before they are stored (usually the database): the mail receiver retries, but check POST /v1/inbound/email errors in the log."

      - alert: OutflareDesktopReportErrors
        expr: sum(increase(outflare_desktop_reports_total{outcome="error"}[15m])) > 5
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "Reports from Outflare for desktop fail on Outflare's side (usually the database): check POST /v1/desktop/reports errors in the log."

      - alert: OutflareDesktopProviderBroken
        expr: sum by (provider) (increase(outflare_desktop_read_failures_total{code=~"bad_response|forbidden"}[1h])) > 20 and sum by (provider) (increase(outflare_desktop_readings_total[1h])) < sum by (provider) (increase(outflare_desktop_read_failures_total{code=~"bad_response|forbidden"}[1h]))
        for: 30m
        labels: { severity: warning }
        annotations:
          summary: "Outflare for desktop can't read {{ $labels.provider }} on most computers (bad_response or forbidden): the provider likely changed its endpoint. Switch that source off in ai_desktop_sources_off and fix the reader in desktop/."

      - alert: OutflareDesktopMostlySilent
        expr: sum(outflare_desktop_devices{state="silent"}) > 3 and sum(outflare_desktop_devices{state="silent"}) > 3 * sum(outflare_desktop_devices{state="reporting"})
        for: 12h
        labels: { severity: info }
        annotations:
          summary: "Most linked computers haven't reported for over 12 hours: check the Outflare for desktop release and GET /v1/desktop/config, or the apps can't reach the server."

      - alert: OutflareTelegramUnreachable
        expr: sum(increase(outflare_telegram_steps_total{outcome="unreachable"}[1h])) > 10 and sum(increase(outflare_telegram_steps_total{outcome="unreachable"}[1h])) > sum(increase(outflare_telegram_steps_total{outcome=~"success|connected|needs_password"}[1h]))
        for: 1h
        labels: { severity: warning }
        annotations:
          summary: "Most company Telegram account checks and sign-ins can't reach Telegram: check the telegram.* jobs in the log (Telegram down, the server's outbound network, or workspaces' proxies)."

      - alert: OutflareTelegramSignedOut
        expr: sum(increase(outflare_telegram_steps_total{outcome="signed_out"}[6h])) > 0
        for: 0m
        labels: { severity: info }
        annotations:
          summary: "A company Telegram account's session ended (ended from its phone, or by Telegram): its workspace sees it as signed out in Settings, Team and has to scan the QR code again. Many at once can mean Telegram is ending sessions from this server."

      - alert: OutflareTelegramSyncBehind
        expr: max(outflare_telegram_sync_lag_seconds) > 1800
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "A company Telegram account hasn't synced its chats into the CRM for over 30 minutes: check telegram_account.sync_failed in the engine log and the Telegram syncs panel (Telegram unreachable, a session ended, or the job queue behind)."

      - alert: OutflareTelegramSummariesFailing
        expr: sum(rate(outflare_telegram_summaries_total{outcome="failed"}[1h])) > 0.002 and sum(rate(outflare_telegram_summaries_total{outcome="failed"}[1h])) > sum(rate(outflare_telegram_summaries_total{outcome="success"}[1h]))
        for: 30m
        labels: { severity: info }
        annotations:
          summary: "Most AI summaries of Telegram chats are failing: check telegram_chat.summary_failed in the engine log (a workspace's AI key or model broken, or the provider down)."

      - alert: OutflareExchangeRatesStale
        expr: max(outflare_exchange_rates_newest_age_seconds) > 6 * 86400
        for: 1h
        labels: { severity: warning }
        annotations:
          summary: "The newest exchange rate is over 6 days old, so receipts in other currencies wait for their dollar amount: check exchange_rates.fetch_failed in the engine log (the European Central Bank's feed down or blocked)."

      - alert: OutflareGeoFilesStale
        expr: max(outflare_geoip_file_age_seconds) > 40 * 86400
        for: 1h
        labels: { severity: warning }
        annotations:
          summary: "A server's DB-IP city or network file is over 40 days old, so new visits and clicks get older city and network data: check geoip.download_failed in the engine log (download.db-ip.com blocked, or OUTFLARE_GEOIP_DIR not writable). See the IP geolocation row."

      - alert: OutflareGeoDownloadsFailing
        expr: sum(increase(outflare_geoip_downloads_total{outcome="error"}[1d])) >= 4
        for: 5m
        labels: { severity: info }
        annotations:
          summary: "DB-IP file downloads failed at every check for a day: the files in use stay until they're stale. Check geoip.download_failed in the engine log. See the IP geolocation row."

      - alert: OutflareReviewRequestsBehind
        expr: max(outflare_jobs_oldest_due_seconds{kind="reviews.dispatch"}) > 300
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Review invitation batches have waited over 5 minutes. Check workers and reviews.dispatch jobs."

      - alert: OutflareReviewRequestsFailing
        expr: sum(increase(outflare_jobs_processed_total{kind="reviews.dispatch",outcome=~"retried|dead"}[15m])) > 3
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Review invitation batches are failing repeatedly. Inspect reviews.dispatch jobs and email configuration."

      - alert: OutflareCoverageChecksOverdue
        expr: max(outflare_jobs_oldest_due_seconds{kind=~"coverage[.](check|review|extract|discover|search|competitor_scan|opportunities_refresh)"}) > 900
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "Coverage checks are over fifteen minutes late; inspect coverage.check workers and scheduler errors."
      - alert: OutflareCoverageChecksFailing
        expr: sum(increase(outflare_jobs_processed_total{kind=~"coverage[.](check|review|extract|discover|search|competitor_scan|opportunities_refresh)",outcome="dead"}[30m])) > 0
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Coverage checks exhausted retries; inspect dead coverage.check jobs."
      - alert: OutflareCoveragePagesUnreachable
        expr: sum(rate(outflare_coverage_checks_total{health="unreachable"}[1h])) / sum(rate(outflare_coverage_checks_total[1h])) > 0.5 and sum(increase(outflare_coverage_checks_total[1h])) > 20
        for: 30m
        labels: { severity: warning }
        annotations:
          summary: "Most Coverage pages are unreachable; inspect DNS, network access and page-reader results."

      - alert: OutflarePresenceSearchesFailing
        expr: sum(increase(outflare_coverage_search_runs_total{outcome=~"connector_(invalid|unavailable)"}[1h])) > 5 and sum(increase(outflare_coverage_search_runs_total{outcome=~"connector_(invalid|unavailable)"}[1h])) > sum(increase(outflare_coverage_search_runs_total{outcome="done"}[1h]))
        for: 30m
        labels: { severity: warning }
        annotations:
          summary: "Presence web searches are failing more often than they work; inspect coverage.search logs and the search results connectors."

      - alert: OutflarePresenceCompetitorScansFailing
        expr: sum(increase(outflare_coverage_competitor_scans_total{outcome=~"connector_(invalid|unavailable)|provider_error|internal"}[1h])) > 5 and sum(increase(outflare_coverage_competitor_scans_total{outcome=~"connector_(invalid|unavailable)|provider_error|internal"}[1h])) > sum(increase(outflare_coverage_competitor_scans_total{outcome="done"}[1h]))
        for: 30m
        labels: { severity: warning }
        annotations:
          summary: "Competitor presence scans are failing more often than they work; inspect coverage.competitor_scan logs and the search results and SEO connectors."

      - alert: OutflareCompetitorSuggestionsFailing
        expr: sum(increase(outflare_seo_competitor_suggestions_total{outcome="error"}[6h])) > 5 and sum(increase(outflare_seo_competitor_suggestions_total{outcome="error"}[6h])) > sum(increase(outflare_seo_competitor_suggestions_total{outcome="ok"}[6h]))
        for: 1h
        labels: { severity: warning }
        annotations:
          summary: "The daily look for new competitors fails more often than it works; inspect seo.sync logs (suggest) and the SEO connectors."

      - alert: OutflareCoverageReviewsFailing
        expr: sum(increase(outflare_coverage_reviews_total{status="review_failed"}[1h])) > 5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Coverage accuracy reviews are failing; inspect workspace model responses and coverage.review logs."

      - alert: OutflarePersonalGoogleCaptureFailing
        expr: sum(increase(outflare_jobs_processed_total{kind="crm_mail.google_sync",outcome=~"retried|dead"}[15m])) > 2
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Personal CRM Google capture is failing; check Google app access, connection status and crm_mail.google_sync jobs."

      - alert: OutflarePersonalGoogleCaptureDelayed
        expr: max(outflare_jobs_oldest_due_seconds{kind="crm_mail.google_sync"}) > 900
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Personal CRM Google capture jobs are over fifteen minutes late; check worker capacity and database access."

      - alert: OutflareWorkspaceCalendarCaptureFailing
        expr: sum(increase(outflare_jobs_processed_total{kind="crm_calendar.workspace_sync",outcome=~"retried|dead"}[30m])) > 2
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Reading Workspace members' calendars into the CRM is failing; check the Google Workspace connection's domain-wide delegation for calendar.readonly and crm_calendar.workspace_sync jobs."

      - alert: OutflareMailPrivacyChecksFailing
        expr: sum(increase(outflare_crm_mail_privacy_checks_total{outcome=~"failed|no_ai|budget"}[1h])) > 20
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "Email privacy checks are failing, so colleagues don't see new work email; check the workspace's AI connection and limits and crm_mail.privacy_check logs."

      - alert: OutflareFunnelsTimingOut
        expr: sum(increase(outflare_insights_runs_total{outcome="timeout"}[30m])) > 3
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Insight queries (funnels, trends, retention, shared dashboards, alert checks or the digest) are hitting their 30-second limit; check the Insights panels for run time by kind and the database's load."
      - alert: OutflareFunnelsFailing
        expr: sum(increase(outflare_insights_runs_total{outcome="error"}[30m])) > 3
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Insight queries are failing with errors; the Insights panels say which kind, and the server log has each error by request id."

      # ---- Paid media (sync and alerts): the hourly ad sync, click harvest,
      # change events and alert job (engine/internal/adsync). ----
      - alert: OutflareAdSyncLagging
        expr: (time() - max(timestamp(outflare_ads_sync_runs_total{outcome="success"}))) > 10800 and sum(outflare_ads_sync_runs_total) > 0
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "No ad sync has succeeded for over three hours though they run hourly: connections are failing (ads.synced events with an error code in the log) or no worker runs them. Today's spend, the alerts and the suggestions are stale. Check the Paid media (sync and alerts) row."
      - alert: OutflareAdSyncsFailing
        expr: sum(increase(outflare_ads_sync_runs_total{outcome!="success"}[3h])) > 5 and sum(increase(outflare_ads_sync_runs_total{outcome!="success"}[3h])) > sum(increase(outflare_ads_sync_runs_total{outcome="success"}[3h]))
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "Hourly ad syncs fail more often than they work over three hours. connector_auth means sign-ins need renewing (the connection shows it); connector_quota means a network is rate limiting us; internal is ours (the log has each by request id). Check the Paid media (sync and alerts) row."
      - alert: OutflareAdClickHarvestFailing
        expr: sum(increase(outflare_ads_clicks_harvested_total{outcome!="stored"}[6h])) > 3
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Google refused the click harvest (click_view) more than three times in six hours, so ad_clicks stops at its last day and landing pages with only a gclid can't be tied to their ad group, ad and keyword. Google keeps 90 days: a harvest stuck for weeks loses clicks for good. The outcome label says why (connector_quota, connector_auth). Check the Paid media (sync and alerts) row."
      - alert: OutflareAdChangeEventsFailing
        expr: sum(increase(outflare_ads_change_event_reads_total{outcome!="success"}[1h])) > 3 and sum(increase(outflare_ads_change_event_reads_total{outcome!="success"}[1h])) > sum(increase(outflare_ads_change_event_reads_total{outcome="success"}[1h]))
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "Reads of ad platforms' change histories (Google change_event, every 15 minutes) fail more often than they work: the Changes tab stops showing what people and Google change, and the auto-apply audit goes blind. ad_change_events.read events in the log carry the error code. Check the Paid media (sync and alerts) row."
      - alert: OutflareAdAlertJobFailing
        expr: sum(increase(outflare_ads_alert_runs_total{outcome="error"}[3h])) > 3
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "The paid ads alert job (after each hourly sync) failed more than three times in three hours: spend anomalies, overspend pauses, flatlines and tracking problems are not being raised or expired. ad_alerts.failed in the log has each error by request id. Check the Paid media (sync and alerts) row."
      - alert: OutflareAdAlertFlood
        expr: sum(increase(outflare_ads_alerts_total[1h])) > 50
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Over fifty paid ads alerts were raised in an hour across every workspace. A few a day is normal; a flood means a rule misfires (a baseline broken by a sync that wrote zeros, or a threshold too tight) and people are being paged for nothing. The kind label on the Paid media (sync and alerts) row says which rule."
      # ---- Brand knowledge (the sheet ads are written from) ----
      - alert: OutflareBrandKnowledgeReadsFailing
        expr: sum(increase(outflare_brand_knowledge_reads_total{outcome!="success"}[24h])) > 3 and sum(increase(outflare_brand_knowledge_reads_total{outcome!="success"}[24h])) > sum(increase(outflare_brand_knowledge_reads_total{outcome="success"}[24h]))
        for: 1h
        labels: { severity: warning }
        annotations:
          summary: "Reads of brands' websites for their knowledge sheet fail more often than they work over a day, so ads can't be written from them; check the Brand knowledge row, then brand.knowledge_read_failed events for the code (connector_needed, ai_model_needed, page codes) and the brand.read_knowledge job's log."
      # The paid ads ledger (engine/internal/paidads): sign-ups, payments and
      # refunds tied to the ad click that brought them, read a few minutes
      # after they arrive.
      - alert: OutflarePaidAdsLedgerBehind
        expr: max(outflare_paidads_ledger_lag_seconds) > 1800
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "The paid ads ledger is over 30 minutes behind for some workspace with an ad account, so cost per new paying customer is stale: the loop is stuck, failing (see OutflarePaidAdsLedgerFailing) or not running on any worker. Check the Paid media (cost per new customer) row and paidads.run_failed in the log."
      - alert: OutflarePaidAdsLedgerFailing
        expr: sum(increase(outflare_paidads_ledger_events_total{outcome="error"}[1h])) > 3
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "More than three customer events failed in the paid ads ledger in an hour: a workspace's run stops at the failing event and retries it every minute, so its ledger falls behind. The error is in ad_acquisition_runs.last_error and the log (paidads.run_failed). Check the Paid media (cost per new customer) row."
      # ---- Paid media (findings and verdicts): the rules that write the
      # findings queue and judge changes (engine/internal/adsuggest). Run
      # failures are OutflareAdSuggestionsFailing above. ----
      - alert: OutflareAdFindingsStale
        expr: (time() - max(timestamp(outflare_ads_suggest_run_seconds_count{outcome="success"}))) > 90000 and sum(increase(outflare_ads_sync_runs_total{outcome="success"}[25h])) > 0
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "No run of the paid ads rules has succeeded in 25 hours while ad accounts keep syncing: findings aren't refreshed, savings aren't applied and measured changes aren't judged for any brand. The run follows each hourly sync (ads.suggest job); ad_suggestions.failed in the log has each failure by request id. Check the Paid media (findings and verdicts) row."
      - alert: OutflareAdFindingVerdictsBad
        expr: sum by (kind) (increase(outflare_ads_verdicts_total{verdict="did_not_work"}[7d])) > 5 and sum by (kind) (increase(outflare_ads_verdicts_total{verdict="did_not_work"}[7d])) > sum by (kind) (increase(outflare_ads_verdicts_total{verdict="worked"}[7d]))
        labels: { severity: info }
        annotations:
          summary: "Over a week, changes of one kind of paid ads finding did not work more often than they worked (the kind label says which): that rule's thresholds want a look (engine/internal/adsuggest/rules.go) before more brands let it apply on its own. Check the Paid media (findings and verdicts) row."
