# Self-host Outflare: docker compose -f deploy/docker-compose.yml up -d
# Then open http://localhost:8080
name: outflare

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: outflare
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-outflare}
      POSTGRES_DB: outflare
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U outflare"]
      interval: 5s
      timeout: 3s
      retries: 20

  engine:
    build:
      context: ..
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://outflare:${POSTGRES_PASSWORD:-outflare}@postgres:5432/outflare?sslmode=disable
      WORKERS: ${WORKERS:-32}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      OUTFLARE_SECRET_KEY: ${OUTFLARE_SECRET_KEY:?set OUTFLARE_SECRET_KEY in deploy/.env (openssl rand -base64 32)}
      OUTFLARE_SECRET_KEY_PREVIOUS: ${OUTFLARE_SECRET_KEY_PREVIOUS:-}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      MICROSOFT_OAUTH_CLIENT_ID: ${MICROSOFT_OAUTH_CLIENT_ID:-}
      MICROSOFT_OAUTH_CLIENT_SECRET: ${MICROSOFT_OAUTH_CLIENT_SECRET:-}
      # Behind a proxy (Fly.io: Fly-Client-IP, Cloudflare: CF-Connecting-IP).
      CLIENT_IP_HEADER: ${CLIENT_IP_HEADER:-}
      # Let webhooks reach private and plain-http addresses (receivers on your own network).
      WEBHOOKS_ALLOW_PRIVATE: ${WEBHOOKS_ALLOW_PRIVATE:-false}
      # Let connectors and mailbox servers be on your own network (a self-hosted Matomo, a local mail server).
      OUTFLARE_CONNECTORS_ALLOW_PRIVATE: ${OUTFLARE_CONNECTORS_ALLOW_PRIVATE:-false}
      # Requests per minute per API token; 0 for no limit.
      API_RATE_LIMIT: ${API_RATE_LIMIT:-600}
      OUTFLARE_LOG_RETENTION_DAYS: ${OUTFLARE_LOG_RETENTION_DAYS:-30}
      # Passkey sign-in: auto (on once PUBLIC_URL is https), on or off.
      PASSKEYS: ${PASSKEYS:-auto}
      # Optional: tell your website (a parent domain of PUBLIC_URL) that someone is signed in.
      OUTFLARE_SIGNED_IN_COOKIE_DOMAIN: ${OUTFLARE_SIGNED_IN_COOKIE_DOMAIN:-}
      # Optional: account emails (confirmation, password reset) through Postmark, Resend or Cloudflare.
      EMAIL_FROM: ${EMAIL_FROM:-}
      POSTMARK_SERVER_TOKEN: ${POSTMARK_SERVER_TOKEN:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      CLOUDFLARE_EMAIL_API_TOKEN: ${CLOUDFLARE_EMAIL_API_TOKEN:-}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      # Optional: reach Claude through a gateway instead of api.anthropic.com.
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      # Anonymous daily usage report and update check: off, or point it elsewhere. See docs/telemetry.md.
      OUTFLARE_TELEMETRY: ${OUTFLARE_TELEMETRY:-}
      DO_NOT_TRACK: ${DO_NOT_TRACK:-}
      # Optional: your own PostHog project for product analytics in the web app. See docs/product-analytics.md.
      OUTFLARE_POSTHOG_KEY: ${OUTFLARE_POSTHOG_KEY:-}
      OUTFLARE_POSTHOG_HOST: ${OUTFLARE_POSTHOG_HOST:-}
      # Prometheus metrics on a private port, read by the monitoring profile below and never published. See docs/monitoring.md.
      OUTFLARE_METRICS_ADDR: ${OUTFLARE_METRICS_ADDR-:9091}
      OUTFLARE_METRICS_TOKEN: ${OUTFLARE_METRICS_TOKEN:-}
      OUTFLARE_METRICS_PPROF: ${OUTFLARE_METRICS_PPROF:-false}
    ports:
      - "${PORT:-8080}:8080"

  # Optional dashboards and alerts: docker compose -f deploy/docker-compose.yml --profile monitoring up -d
  # Grafana is then on http://localhost:3000: admin with GRAFANA_ADMIN_PASSWORD, or admin/admin and a new password at first sign-in.
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [monitoring]
    restart: unless-stopped
    depends_on: [engine]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - promdata:/prometheus

  grafana:
    image: grafana/grafana-oss:12.1.1
    profiles: [monitoring]
    restart: unless-stopped
    depends_on: [prometheus]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"

volumes:
  pgdata:
  promdata:
  grafanadata:
