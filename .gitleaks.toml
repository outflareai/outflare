useDefault = true

[allowlist]
description = "The documented local-development key (base64 of dev-only-dev-only-...), never used anywhere real"
regexes = ['''ZGV2LW9ubHktZGV2LW9ubHktZGV2LW9ubHktZGV2LTA=''']
