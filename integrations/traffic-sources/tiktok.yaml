id: tiktok
name: "TikTok Ads"
category: search_social
connector: tiktok_ads
click_id: {param: ttclid}
parameters:
  - {name: Campaign ID, param: of_campaign, token: "__CAMPAIGN_ID__", field: 1}
  - {name: Ad set ID, param: of_adset, token: "__AID__", field: 2}
  - {name: Ad ID, param: of_ad, token: "__CID__", field: 3}
  - {name: Placement, param: of_placement, token: "__PLACEMENT__", field: 4}
  - {name: Campaign name, param: utm_campaign, token: "__CAMPAIGN_NAME__", field: 5}
  - {name: Ad name, param: utm_content, token: "__CID_NAME__", field: 6}
note: "TikTok adds ttclid itself."
# The macros are the ones engine/internal/adtrack verified for the site
# script's tracking templates; a test checks the two agree.
sources: [engine/internal/adtrack/adtrack.go]
