id: pushground
name: "Pushground"
category: push_pop
click_id: {param: click_id, token: "{click_id}"}
cost: {param: cost, token: "{bid}"}
parameters:
  - {name: "Campaign ID", param: campaign_id, token: "{campaign_id}", field: 1}
  - {name: "Creative ID", param: creative_id, token: "{creativity_id}", field: 2}
  - {name: "Supply ID", param: supply_id, token: "{supply_id}", field: 3}
  - {name: "Site ID", param: site_id, token: "{site_id}", field: 4}
  - {name: "Country", param: country, token: "{country}", field: 5}
  - {name: "Device", param: device, token: "{deviceName}", field: 6}
  - {name: "Format", param: format, token: "{format}", field: 7}
postback: {url: "https://lupush.com/conversion?click_id={source_click_id}&amount={payout}", method: GET}
note: "For CPM campaigns, {bidcpm} is the cost per thousand."
sources:
  - https://pushground.com/blog/using-macros-and-utm-tracking-to-track-affiliate-campaigns
  - https://intercom.help/pushground/en/articles/2710130-s2s-postback-configuration
