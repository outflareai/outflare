id: mgid
name: "MGID"
category: native
click_id: {param: clickid, token: "{click_id}"}
cost: {param: cost, token: "{click_price}"}
parameters:
  - {name: "Campaign ID", param: campaign_id, token: "{campaign_id}", field: 1}
  - {name: "Teaser ID", param: teaser_id, token: "{teaser_id}", field: 2}
  - {name: "Widget ID", param: widget_id, token: "{widget_id}", field: 3}
  - {name: "Category ID", param: category_id, token: "{category_id}", field: 4}
  - {name: "Country", param: geo, token: "{geo}", field: 5}
postback: {url: "https://a.mgid.com/postback/REPLACE?c={source_click_id}&e=REPLACE&r={payout}", method: GET}
note: "In the postback, the path is your MGID client id and e is the event name you set up in MGID. MGID says its cost macro can differ from the cost it bills; prefer the cost from its reports."
sources:
  - https://help.mgid.com/tracking-link-macros
  - https://help.mgid.com/what-macros-should-i-add-to-the-tracking-link
  - https://help.mgid.com/postback-setup
  - https://help.redtrack.io/knowledgebase/mgid/
