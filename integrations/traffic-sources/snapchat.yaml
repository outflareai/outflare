id: snapchat
name: "Snapchat Ads"
category: search_social
connector: snapchat_ads
click_id: {param: ScCid}
parameters:
  - {name: Campaign ID, param: of_campaign, token: "{{campaign.id}}", field: 1}
  - {name: Ad set ID, param: of_adset, token: "{{adSet.id}}", field: 2}
  - {name: Ad ID, param: of_ad, token: "{{ad.id}}", field: 3}
  - {name: Campaign name, param: utm_campaign, token: "{{campaign.name}}", field: 5}
note: "Snapchat adds ScCid itself."
# The macros are the ones engine/internal/adtrack verified for the site
# script's tracking templates; a test checks the two agree.
sources: [engine/internal/adtrack/adtrack.go]
