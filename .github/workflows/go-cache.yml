# Fills the Go build cache that CI's test parts restore (ci.yml, "Restore the
# Go build cache"), on every push to main that changes Go code or its
# dependencies. Most pushes to main skip CI's tests because their files
# already passed (the merge queue's batches), and a cache saved by a pull
# request can't be shared, so without this the cache would never be
# refreshed. It builds without the race detector, as pull requests and
# batches test; the nightly race run compiles its own.
#
# It compiles everything the tests and go vet compile, without running
# anything, and keeps only what that build used: restoring the last cache and
# saving it again with this commit's builds added made it grow on every push,
# until unpacking it filled the test runners' disks. It is a workflow of its
# own, so a cancelled or failed fill never counts against main's CI (which
# Cloud waits on before it deploys).
name: Go cache

on:
  push:
    branches: [main]
    paths: ["**.go", go.mod, go.sum, "engine/internal/db/migrations/**", .github/workflows/go-cache.yml]

# Only the newest commit's cache is worth filling.
concurrency:
  group: go-cache
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-build-v3-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-build-v3-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-build-v3-${{ runner.os }}-
      # Go refreshes a cache file's modification time when a build uses it
      # (if it is more than an hour old), so marking every restored file as
      # old, building, and deleting what is still old leaves exactly what
      # this commit's build needs.
      - name: Mark the restored build cache as unused
        run: |
          mkdir -p ~/.cache/go-build
          find ~/.cache/go-build -mindepth 2 -type f -exec touch -d '2 days ago' {} +
          touch -d '1 day ago' "$RUNNER_TEMP/unused-before"
          du -sh ~/.cache/go-build
      - name: Compile everything the tests and go vet compile
        run: |
          go vet ./...
          # -exec /bin/true builds and links every test binary like CI does,
          # then "runs" each with /bin/true, so no test (or database) runs.
          # (-c -o dir can't be used: several packages share a name.)
          go test -exec /bin/true ./...
      - name: Drop what this build didn't use
        run: |
          find ~/.cache/go-build -mindepth 2 -type f ! -newer "$RUNNER_TEMP/unused-before" -delete
          du -sh ~/.cache/go-build
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-build-v3-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}


  # The migrated test database, as a dump the test parts load instead of
  # applying every migration (ci.yml, "Load the saved schema"). Saved once
  # per set of migrations.
  schema:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: outflare_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/outflare_test?sslmode=disable
      # The development key (AGENTS.md): the migrations need one to start.
      OUTFLARE_SECRET_KEY: ZGV2LW9ubHktZGV2LW9ubHktZGV2LW9ubHktZGV2LTA=
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Already saved?
        id: saved
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/schema.sql.gz
          key: schema-v1-${{ hashFiles('engine/internal/db/migrations/**') }}
          lookup-only: true
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        if: steps.saved.outputs.cache-hit != 'true'
        with:
          go-version-file: go.mod
          cache: false
      - name: Migrate an empty database and dump it
        if: steps.saved.outputs.cache-hit != 'true'
        env:
          CONTAINER: ${{ job.services.postgres.id }}
          DUMP: ${{ runner.temp }}/schema.sql.gz
        run: |
          go run ./engine/cmd/outflare migrate
          # The server's own pg_dump, so the versions always match.
          docker exec "$CONTAINER" pg_dump -U postgres -d outflare_test | gzip >"$DUMP"
          ls -l "$DUMP"
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: steps.saved.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/schema.sql.gz
          key: schema-v1-${{ hashFiles('engine/internal/db/migrations/**') }}
