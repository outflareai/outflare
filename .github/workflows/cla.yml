# Asks first-time contributors to sign CLA.md, and records signatures on the
# cla-signatures branch. See docs/adr/0005-open-core-cloud.md. "Claude" and
# "claude" (the login GitHub maps Claude Code's co-author address to) cover
# commits written by Claude Code for the maintainers; outflare-publisher[bot]
# writes the release pull requests.
name: CLA

# pull_request_target and issue_comment are safe here: the job never checks
# out or runs code from the pull request, it only reads who signed.
on:
  issue_comment: # zizmor: ignore[dangerous-triggers]
    types: [created]
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types: [opened, synchronize, closed]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    if: github.event_name == 'pull_request_target' || github.event.issue.pull_request
    runs-on: ubuntu-latest
    steps:
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1 # zizmor: ignore[archived-uses]
        if: github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA' || github.event_name == 'pull_request_target'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/outflareai/outflare/blob/main/CLA.md
          path-to-signatures: signatures/v1/cla.json
          branch: cla-signatures
          allowlist: jackfitzgerald,outflare-publisher[bot],dependabot[bot],renovate[bot],github-actions[bot],claude[bot],Claude,claude
