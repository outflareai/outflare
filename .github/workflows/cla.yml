# Asks first-time contributors to sign CLA.md, and records signatures on the
# cla-signatures branch. See docs/adr/0005-open-core-cloud.md. "Claude" and
# "claude" (the login GitHub maps Claude Code's co-author address to) cover
# commits written by Claude Code for the maintainers; outflare-publisher[bot]
# writes the release pull requests; outflare-importer[bot] commits accepted
# pull requests from contributors who signed here, as their co-author;
# outflare-merger[bot] merges main into pull requests to bring them current.
name: CLA

# pull_request_target and issue_comment are safe here: the job never checks
# out or runs code from the pull request, it only reads who signed.
on:
  issue_comment: # zizmor: ignore[dangerous-triggers]
    types: [created]
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types: [opened, synchronize, closed]

# A newer push to a pull request replaces the older check, so superseded
# runs don't hold one of the organisation's few Actions runners.
concurrency:
  group: cla-${{ github.event.pull_request.number || github.event.issue.number }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' }}

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    # Only the two CLA comments start a job; any other comment on a pull
    # request (reviews, bots) doesn't take a runner.
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
       (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    runs-on: ubuntu-latest
    steps:
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1 # zizmor: ignore[archived-uses]
        if: github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA' || github.event_name == 'pull_request_target'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/outflareai/outflare/blob/main/CLA.md
          path-to-signatures: signatures/v1/cla.json
          branch: cla-signatures
          allowlist: jackfitzgerald,outflare-publisher[bot],outflare-importer[bot],outflare-merger[bot],dependabot[bot],renovate[bot],github-actions[bot],claude[bot],Claude,claude
