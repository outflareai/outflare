      - if: env.WEB != 'false'
        run: pnpm --filter @outflare/sdk test
      - if: env.WEB != 'false'
        run: pnpm --filter @outflare/mcp test
      # The event SDKs for Go, Ruby and PHP use only what each language
      # ships with, so they run on the runner's own toolchains. GitHub's
      # machines ship them all; a runner of your own may not, so Go is set up
      # here and tools.sh (below) stands in for the others.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        if: env.WEB != 'false' && env.LIBS != 'false'
        with:
          go-version-file: go.mod
          cache: false
      # Where the runner has no Ruby, PHP, Swift or Gradle, each runs from
      # its official image instead, as the runner's user, on the same files.
      - name: Ruby, PHP, Swift and Gradle, where the runner has none
        if: env.WEB != 'false' && env.LIBS != 'false'
        run: |
          {
            echo 'in_image() { image=$1; shift; docker run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp -e GRADLE_USER_HOME=/tmp/gradle -v "$PWD":/work -w /work "$image" "$@"; }'
            command -v ruby >/dev/null || echo 'ruby() { in_image ruby:3.4-slim ruby "$@"; }'
            command -v php >/dev/null || echo 'php() { in_image php:8.4-cli php "$@"; }'
            command -v swift >/dev/null || echo 'swift() { in_image swift:6.2 swift "$@"; }'
            command -v gradle >/dev/null || echo 'gradle() { in_image gradle:9-jdk21 gradle "$@"; }'
          } > "$RUNNER_TEMP/tools.sh"
      - name: Go, Ruby and PHP event SDK tests
        if: env.WEB != 'false' && env.LIBS != 'false'
        run: |
          . "$RUNNER_TEMP/tools.sh"
          (cd sdk/go && go vet ./... && go test ./...)
          (cd sdk/ruby && ruby -Ilib -Itest test/tracker_test.rb)
          (cd sdk/php && php tests/run.php)
      # The libraries for apps. React Native is built by pnpm -r build above;
      # Swift and Gradle are on the runner; Dart is fetched and checked
      # against the hash its release was read with.
      - name: App library tests (React Native, Swift, Android, Flutter)
        if: env.WEB != 'false' && env.LIBS != 'false'
        env:
          DART_VERSION: 3.14.0
          DART_SHA256: 90f7fd75fe21e16437778df882f280910d9bbd4809c90024f21de82435dded1d
        run: |
          . "$RUNNER_TEMP/tools.sh"
          pnpm --filter @outflare/react-native test
          # The Swift package is the one at the top of the repository.
          swift test
          node --test scripts/library-version.test.mjs
          php -r 'require "sdk/php/src/Tracker.php"; $c = json_decode(file_get_contents("composer.json"), true); is_dir(current($c["autoload"]["psr-4"])) || exit(1);'
          (cd sdk/android && gradle --no-daemon -q test)
          curl -fsSL -o "$RUNNER_TEMP/dart.zip" "https://storage.googleapis.com/dart-archive/channels/stable/release/$DART_VERSION/sdk/dartsdk-linux-x64-release.zip"
          echo "$DART_SHA256  $RUNNER_TEMP/dart.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/dart.zip" -d "$RUNNER_TEMP"
          (cd sdk/flutter && "$RUNNER_TEMP/dart-sdk/bin/dart" pub get && "$RUNNER_TEMP/dart-sdk/bin/dart" analyze --fatal-infos && "$RUNNER_TEMP/dart-sdk/bin/dart" test)
      # The bring-your-own-keys scan (engine/internal/ownkeys, which reads
      # TypeScript too) runs in every light part and every batch, so not
      # here again: it cost two minutes on 267 runs a day.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: env.PYTHON != 'false'
        with:
          python-version: |
            3.9
            3.13
      - name: Python SDK tests on the oldest and newest supported Python
        if: env.PYTHON != 'false'
        working-directory: sdk/python
        run: |
          for py in 3.9 3.13; do
            python$py -m venv .venv-$py
            .venv-$py/bin/pip install -q -e '.[test]'
            .venv-$py/bin/pytest -q
          done
      - name: Python SDK lint
        if: env.PYTHON != 'false'
        working-directory: sdk/python
        run: pipx run ruff check . && pipx run ruff format --check .

  # The engine and web jobs already compile everything, so the image is
  # built only in a batch whose changes touch what goes into it, and on main
  # when main wasn't tested as a batch.
  docker:
    needs: same-files
    # Runs unless this exact tree already passed. Runs if same-files fails.
    if: ${{ !cancelled() && needs.same-files.outputs.race != 'true' && needs.same-files.outputs.tested != 'true' && needs.same-files.outputs.image != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: docker build -t outflare:ci .

  # Every deploy must be safe to roll back, and must not break the version
  # still serving while it starts (docs/migrations.md). The previous
  # version's tests run in the same parts as the engine job, each with its
  # own database; in one job they took 16 minutes. They run on a pull
  # request that adds a migration (once it is ready: the light set only) and
  # every part in its batch; any other pull request that touches migrations
  # runs only the checks.
  migrations-part:
    needs: same-files
    # Only pull requests that change migrations (above). Runs if same-files
    # fails.
    if: ${{ !cancelled() && github.event_name == 'pull_request' && (needs.same-files.outputs.migrations == 'true' || needs.same-files.result != 'success') }}
    name: migrations (${{ matrix.name }})
    runs-on: ubuntu-latest
    # A light part runs go test twice (the packages that share the database,
    # then the others), each allowed 25 minutes by scripts/test-shard.sh,
    # after building this version and the previous one. At 30 minutes the
    # first light part was stopped with every test still passing.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.same-files.outputs.migration_parts || '[{"name":"api 1/5","part":"api 1 5"},{"name":"api 2/5","part":"api 2 5"},{"name":"api 3/5","part":"api 3 5"},{"name":"api 4/5","part":"api 4 5"},{"name":"api 5/5","part":"api 5 5"},{"name":"rest","part":"rest"}]') }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: outflare_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      BASE: ${{ github.event.pull_request.base.sha }}
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/outflare_test?sslmode=disable
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/outflare_test?sslmode=disable
      OUTFLARE_SECRET_KEY: ZGV2LW9ubHktZGV2LW9ubHktZGV2LW9ubHktZGV2LTA=
      PART: ${{ matrix.part }}
      CHANGED: ${{ needs.same-files.outputs.changed }}
      # Like the engine job, no race detector (it runs nightly on main): the
      # base commit's scripts/test-shard.sh turns it on unless RACE is set,
      # and made this job two to three times slower than the rest.
      RACE: ""
      # Half the API package under -race runs past go test's default 10
      # minutes on a fresh schema. The tests run the base commit's
      # scripts/test-shard.sh, so the longer timeout comes from here; go list
      # and go vet ignore it.
      GOFLAGS: -timeout=25m
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false
      # The tests' database is thrown away with the job, so it needn't
      # survive a crash: without syncing every commit to disk the API tests
      # ran 18% faster on a two-core runner (2026-11-18). A service container
      # takes no server flags, so set them once it is up. Never fails a job.
      - name: Postgres doesn't sync to disk
        if: matrix.part != ''
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d outflare_test -q \
            -c "ALTER SYSTEM SET fsync = off" \
            -c "ALTER SYSTEM SET synchronous_commit = off" \
            -c "ALTER SYSTEM SET full_page_writes = off" \
            -c "SELECT pg_reload_conf()" || echo "::warning::Could not turn off disk syncing; the tests run as before."
      # The engine job's Go build cache (see there), so the previous
      # version's tests compile only what changed since main's last fill.
      # A self-hosted runner keeps its disk between jobs, and several runners
      # can share one disk: Go's caches and Docker's images fill it in time,
      # and a full disk fails the cache restore and the tests' databases.
      - name: Make room on a self-hosted runner
        id: room
        if: runner.environment != 'github-hosted'
        run: |
          df -h ~ | tail -1
          # Runners that share a disk fill it together: their caches take a
          # large part of it, and every job's test database needs room at the
          # same moment, so a disk that looks half free can run out mid-job.
          # So past 50% this runner gives back what it can rebuild: its Go
          # caches and its Docker images, build cache and stale volumes. Only
          # the runners that start a job while the disk is that full do it,
          # which brings it back under 50% without every job starting cold.
          docker container prune -f >/dev/null 2>&1 || true
          docker volume prune -af >/dev/null 2>&1 || docker volume prune -f >/dev/null 2>&1 || true
          docker builder prune -af >/dev/null 2>&1 || true
          used=$(df --output=pcent ~ | tail -1 | tr -dc 0-9)
          # Go trims its build cache only after five days, so a busy runner's
          # grows without limit: start it again past 8 GB.
          build=$(du -sm ~/.cache/go-build 2>/dev/null | cut -f1)
          echo "Go build cache: ${build:-0} MB"; docker system df 2>/dev/null || true
          if [ "${used:-0}" -ge 50 ] || [ "${build:-0}" -ge 8000 ]; then
            chmod -R u+w ~/go/pkg/mod 2>/dev/null || true
            rm -rf ~/.cache/go-build ~/go/pkg/mod
            docker system prune -af --volumes >/dev/null 2>&1 || true
            df -h ~ | tail -1
          fi
          # The runner still has its last job's Go caches: restoring the saved
          # one over them fails file by file (the module cache is read-only)
          # and costs half a minute of errors. Restore only onto an empty one.
          if [ -d ~/.cache/go-build ] && [ -d ~/go/pkg/mod ]; then echo "warm=true" >> "$GITHUB_OUTPUT"; fi
      - name: Make room for the Go build cache
        if: matrix.part != ''
        run: |
          df -h /
          sudo nohup rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /usr/share/swift >/dev/null 2>&1 &
      - name: Restore the Go build cache
        if: matrix.part != '' && steps.room.outputs.warm != 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-build-v3-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ env.BASE }}
          restore-keys: |
            go-build-v3-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-build-v3-${{ runner.os }}-
      - name: Append-only, unique numbers, expand-only
        if: matrix.name == 'rest' || matrix.part == ''
        run: go run ./scripts/checkmigrations -base "$BASE"
      - name: Apply this branch's migrations
        if: matrix.part != ''
        run: go run ./engine/cmd/outflare migrate
      - name: The previous version's tests pass on the new schema
        # This is what runs while the new version starts, and after a
        # rollback: the base branch's code on this branch's database.
        if: matrix.part != ''
        run: |
          git checkout --quiet "$BASE"
          # shellcheck disable=SC2086 # the part is several words
          scripts/test-shard.sh $PART

  # The one check the merge queue waits for: passes when every part above
  # passed, and is skipped with them.
  migrations:
    needs: [same-files, migrations-part]
    if: ${{ !cancelled() && needs.migrations-part.result != 'skipped' }}
    runs-on: ubuntu-latest
    steps:
      - name: Every part passed
        env:
          RESULT: ${{ needs.migrations-part.result }}
        run: |
          echo "migrations parts: $RESULT"
          [ "$RESULT" = success ]

  # The nightly race run has no pull request to tell: a failure opens an
  # issue (or comments on the open one), only in the private engine
  # repository, where the team works on them.
  nightly-failed:
    needs: [same-files, engine]
    if: ${{ failure() && needs.same-files.outputs.race == 'true' && github.repository == 'outflareai/engine' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Open or update the issue
        run: |
          title="The nightly race tests failed"
          n=$(gh issue list --state open --search "\"$title\" in:title" --json number,title --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          body="The tests failed under the race detector on main at ${GITHUB_SHA::7}: $RUN_URL. Pull requests and batches run without it, so this is the only run that finds data races. Fix the race; never skip the test."
          if [ -n "$n" ]; then gh issue comment "$n" --body "$body"; else gh issue create --title "$title" --body "$body"; fi
