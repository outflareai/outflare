name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # Nightly: every test under the race detector, on main (scripts/test-shard.sh).
  schedule:
    - cron: "37 2 * * *"
  # For a push made with a workflow's own token, which starts no
  # workflows: that workflow starts this run itself. With race on, it is
  # the nightly run, started by Notify Cloud when the cron didn't fire.
  workflow_dispatch:
    inputs:
      race:
        description: Every part under the race detector (the nightly run)
        type: boolean
        default: false

# A newer push to a pull request replaces its run: Actions minutes are
# billed per job, so finishing a superseded run is money for nothing. Runs
# on main always finish.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only token: CI never writes to the repository.
permissions:
  contents: read

jobs:
  # Decides how much of CI this commit needs, so a pull request doesn't hold
  # one of the organisation's few Actions runners for work that can't fail.
  #
  # Pull requests get light checks; the merge queue's batch gets everything
  # once, for every pull request in it (Cloud's docs/merge-queue.md):
  #
  # - A pull request that is ready for review runs one quick part: gofmt,
  #   go vet (which compiles everything) and the tests of the packages it
  #   changes itself, never the API package; and the web, SDK and Python
  #   jobs only when it changes what they build. Its batch runs every test
  #   with main straight after, so nothing is tested twice. A draft runs
  #   none of the Go tests, nor does a change to docs, change notes or web/
  #   alone, nor a head that only merges main into a commit whose tests
  #   passed. A migration gets its file checks; the rollback check runs in
  #   its batch.
  # - A batch (batch/*) runs every part, the Docker image when its inputs
  #   changed, the library tests when a library changed, and the migrations
  #   job (every part) when it adds a migration that does more than add.
  # - On main, a commit whose files are exactly a commit CI already passed on
  #   (the batch the merge queue fast-forwarded main to, or a merge whose
  #   second parent is one) isn't tested again: every job is skipped and the
  #   run counts as passed.
  # - Nightly, every part runs on main under the race detector.
  same-files:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read # finds the earlier run
      checks: read # finds the Go tests that passed before main was merged in
      pull-requests: read # lists the pull request's files
    outputs:
      tested: ${{ steps.tree.outputs.tested }}
      go: ${{ steps.scope.outputs.go }}
      parts: ${{ steps.scope.outputs.parts || '[{"name":"api 1/5","part":"api 1 5"},{"name":"api 2/5","part":"api 2 5"},{"name":"api 3/5","part":"api 3 5"},{"name":"api 4/5","part":"api 4 5"},{"name":"api 5/5","part":"api 5 5"},{"name":"rest","part":"rest"}]' }}
      # The nightly race run: on the schedule, or dispatched with race on.
      race: ${{ github.event_name == 'schedule' || inputs.race == true }}
      migrations: ${{ steps.scope.outputs.migrations }}
      migration_parts: ${{ steps.scope.outputs.migration_parts }}
      changed: ${{ steps.scope.outputs.changed }}
      web: ${{ steps.scope.outputs.web || 'true' }}
      python: ${{ steps.scope.outputs.python || 'true' }}
      image: ${{ steps.scope.outputs.image || 'true' }}
      libs: ${{ steps.scope.outputs.libs || 'true' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: github.event_name == 'push'
        with:
          persist-credentials: false
          fetch-depth: 2
      # A pull request's own head and main's history, to tell a commit that
      # only merges main from one that changes something.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: github.event_name == 'pull_request' && !github.event.pull_request.draft
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Already tested?
        if: github.event_name == 'push'
        id: tree
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tree=$(git rev-parse HEAD^{tree})
          for c in HEAD HEAD^2; do
            sha=$(git rev-parse -q --verify "$c^{commit}" 2>/dev/null) || continue
            [ "$(git rev-parse "$sha^{tree}")" = "$tree" ] || continue
            ok=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$sha&status=success&per_page=50" \
              --jq "[.workflow_runs[] | select(.path == \".github/workflows/ci.yml\" and .id != $GITHUB_RUN_ID)] | length" || echo 0)
            if [ "$ok" -gt 0 ]; then
              echo "CI already passed on ${sha::7}, which has exactly these files; skipping."
              echo "tested=true" >> "$GITHUB_OUTPUT"; exit 0
            fi
          done
      # checkmigrations -additive (below) needs Go; only a batch asks.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'batch/')
        with:
          go-version-file: go.mod
          cache: false
      - name: Do the Go tests need to run?
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          DRAFT: ${{ github.event.pull_request.draft }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != pull_request ]; then echo "go=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          batch=false
          case "$HEAD_REF" in batch/*) batch=true ;; esac
          # The event and app libraries (Go, Ruby, PHP, Swift, Android,
          # Flutter, React Native) have their own toolchains and tests, and
          # nothing else in the repository can break them: they run only
          # when one of them, or what they are versioned and packaged by,
          # changes. They took about four minutes of every batch.
          libs='^(sdk/(go|ruby|php|swift|android|flutter|react-native)/|Package\.swift|composer\.json|scripts/library-version|\.github/workflows/ci\.yml)'
          if ! listed=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[] | "\(.status)\t\(.filename)"'); then
            echo "go=true" >> "$GITHUB_OUTPUT"; echo "migrations=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(cut -f2 <<<"$listed")
          has() { grep -qE "$1" <<<"$files"; }
          # The migrations job checks the migration files (append-only, unique
          # numbers, expand-only) on any pull request that touches them.
          if has '^(engine/internal/db/migrations/|scripts/checkmigrations/)'; then echo "migrations=true" >> "$GITHUB_OUTPUT"; fi
          # The rollback check itself runs once, in the batch, which tests
          # against the real main; the pull request's own copy cost about
          # 1,300 billed minutes a day (2026-11-18) and its batch ran it
          # again. And only when a new migration can change what the previous
          # version sees: one that only creates tables and plain indexes
          # (checkmigrations -additive, which says no whenever it can't tell,
          # and no on an error) runs the file checks alone.
          if [ "$batch" != true ] || ! grep -qE '^added[[:space:]]engine/internal/db/migrations/' <<<"$listed"; then
            echo 'migration_parts=[{"name":"check","part":""}]' >> "$GITHUB_OUTPUT"
          elif [ "$(go run ./scripts/checkmigrations -additive -base "$BASE_SHA" 2>/dev/null || echo false)" = true ]; then
            echo "::notice::The new migrations only add to the schema; the previous version's tests are not run again."
            echo 'migration_parts=[{"name":"check","part":""}]' >> "$GITHUB_OUTPUT"
          fi
          if [ "$batch" = true ]; then
            echo "::notice::A merge queue batch: everything runs."
            echo "go=true" >> "$GITHUB_OUTPUT"
            has "$libs" || echo "libs=false" >> "$GITHUB_OUTPUT"
            if ! has '^(Dockerfile|\.dockerignore|go\.(mod|sum)|pnpm-lock\.yaml|pnpm-workspace\.yaml|package\.json|[^/]+/package\.json)'; then echo "image=false" >> "$GITHUB_OUTPUT"; fi
            exit 0
          fi
          # A pull request on its own: only what it can break, and never the
          # Docker image (its batch builds it).
          echo "image=false" >> "$GITHUB_OUTPUT"
          has "$libs" || echo "libs=false" >> "$GITHUB_OUTPUT"
          has '^(web/|sdk/|mcp/|api/|package\.json|pnpm-|[^/]+/package\.json|Package\.swift|composer\.json|scripts/library-version|engine/internal/ownkeys/)' || echo "web=false" >> "$GITHUB_OUTPUT"
          has '^(sdk/python/|api/)' || echo "python=false" >> "$GITHUB_OUTPUT"
          if [ "$DRAFT" = true ]; then
            echo "::notice::Draft: the Go tests run when this is marked ready for review."
            echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Files no Go test reads. web/ is TypeScript, and its one Go check
          # (ownkeys) also runs in web-and-sdk. Anything else, or a list we
          # can't read, runs the tests.
          other=$(printf '%s\n' "$files" | grep -vE '^(docs/|changes/|web/|[^/]+\.md$)' || true)
          if [ -n "$files" ] && [ -z "$other" ]; then
            echo "::notice::Only docs, change notes or web/ changed; the Go tests are skipped."
            echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # A head that only merges main (git's own merge, nothing edited)
          # into a commit whose Go tests passed changes nothing of the pull
          # request's: its batch tests it with main. Walk back over such
          # merges to the last commit the tests ran on.
          c=$HEAD_SHA tested=
          for _ in $(seq 20); do
            read -r p1 p2 rest <<<"$(git rev-list --parents -n 1 "$c" | cut -d' ' -f2-)" || break
            [ -n "$p2" ] && [ -z "$rest" ] || break
            git merge-base --is-ancestor "$p2" origin/main || break
            [ "$(git merge-tree --write-tree "$p1" "$p2" 2>/dev/null | head -1)" = "$(git rev-parse "$c^{tree}")" ] || break
            c=$p1
            passed=$(gh api "repos/$GITHUB_REPOSITORY/commits/$c/check-runs?per_page=100" \
              --jq '[.check_runs[] | select(.conclusion == "success" and (.name | test("^engine \\((light( [12]/2)?|api [1-3]/3|rest)\\)$"))) | .name] | unique | join(",")' || echo)
            case ",$passed," in *,engine\ \(light*|*engine\ \(api\ 1/3\),engine\ \(api\ 2/3\),engine\ \(api\ 3/3\),engine\ \(rest\)*) tested=$c; break ;; esac
          done
          if [ -n "$tested" ]; then
            echo "::notice::Only main merged in since ${tested::7}, where the Go tests passed; they are skipped."
            echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "go=true" >> "$GITHUB_OUTPUT"
          # One quick part: gofmt, go vet (which compiles every package and
          # its tests) and the tests of the packages the pull request itself
          # changes, never the API package. The batch runs every test with
          # main, and most batches hold one pull request (378 of 456 in two
          # weeks to 2026-11-18), so the light set (importers, and the API
          # package in two shards of about 18 minutes) ran the same tests
          # twice: a third of all Actions minutes, and 23 minutes before a
          # pull request could join a batch that takes 16.
          echo 'parts=[{"name":"light","part":"quick"}]' >> "$GITHUB_OUTPUT"
          {
            echo "changed<<EOF_CHANGED"
            echo "$files"
            echo "EOF_CHANGED"
          } >> "$GITHUB_OUTPUT"

  # The tests run in six parts side by side, each with its own database
  # (scripts/test-shard.sh): the API package split in five, and everything
  # else. One job took 6-8 minutes; a batch is as slow as its slowest part.
  engine:
    needs: same-files
    # Runs unless this exact tree already passed, or the pull request doesn't
    # need it yet (above). Runs if same-files itself fails.
    if: ${{ !cancelled() && needs.same-files.outputs.tested != 'true' && needs.same-files.outputs.go != 'false' }}
    name: engine (${{ matrix.name }})
    runs-on: ubuntu-latest
    # A pull request's first light part runs its share of the API tests and
    # then every changed package and its importers. A change to a package
    # most others import took 29 minutes and was stopped at 30 twice with no
    # test failing; the batch's parts take about 15 and are not affected.
    timeout-minutes: 45
    permissions:
      contents: read
      issues: write # files a test that only passed when re-run
    strategy:
      fail-fast: false
      matrix:
        # api 1/5 to api 5/5 and rest; light (one or two shards) on a pull request
        # (same-files above).
        include: ${{ fromJSON(needs.same-files.outputs.parts || '[{"name":"api 1/5","part":"api 1 5"},{"name":"api 2/5","part":"api 2 5"},{"name":"api 3/5","part":"api 3 5"},{"name":"api 4/5","part":"api 4 5"},{"name":"api 5/5","part":"api 5 5"},{"name":"rest","part":"rest"}]') }}
    services:
      # Postgres with pgvector, so meaning-based search is tested. The
      # migrations job below keeps plain Postgres, which proves the engine
      # migrates and runs without it.
      postgres:
        image: pgvector/pgvector:0.8.0-pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: outflare_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 20
      # The optional analytics store (docs/adr/0010-analytics-storage.md).
      clickhouse:
        image: clickhouse/clickhouse-server:25.8
        env:
          CLICKHOUSE_DB: outflare_test
          CLICKHOUSE_USER: test
          CLICKHOUSE_PASSWORD: test
        ports: ["8123:8123"]
        options: >-
          --health-cmd "wget -qO- http://localhost:8123/ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/outflare_test?sslmode=disable
      CLICKHOUSE_TEST_URL: http://test:test@localhost:8123/outflare_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false
      # The tests' database is thrown away with the job, so it needn't
      # survive a crash: without syncing every commit to disk the API tests
      # ran 18% faster on a two-core runner (2026-11-18). A service container
      # takes no server flags, so set them once it is up. Never fails a job.
      - name: Postgres doesn't sync to disk
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d outflare_test -q \
            -c "ALTER SYSTEM SET fsync = off" \
            -c "ALTER SYSTEM SET synchronous_commit = off" \
            -c "ALTER SYSTEM SET full_page_writes = off" \
            -c "SELECT pg_reload_conf()" || echo "::warning::Could not turn off disk syncing; the tests run as before."
      # Applying every migration to an empty database took 30 to 65 seconds
      # of each part. go-cache.yml saves main's migrated database as a dump
      # whenever the migrations change; loading it takes about 3 seconds, and
      # the tests then apply only the migrations it doesn't have. If it can't
      # be loaded the database is emptied again and the tests migrate it
      # themselves, as before.
      - name: Restore the saved schema
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/schema.sql.gz
          key: schema-v1-${{ hashFiles('engine/internal/db/migrations/**') }}
          restore-keys: |
            schema-v1-
      - name: Load the saved schema
        env:
          PGPASSWORD: postgres
          DUMP: ${{ runner.temp }}/schema.sql.gz
        run: |
          if [ ! -s "$DUMP" ]; then echo "No saved schema; the tests apply every migration."; exit 0; fi
          if ! gunzip -c "$DUMP" | psql -h localhost -U postgres -d outflare_test -q -v ON_ERROR_STOP=1 >/dev/null; then
            echo "::warning::The saved schema didn't load; the tests apply every migration."
            psql -h localhost -U postgres -d postgres -q -c "DROP DATABASE outflare_test" -c "CREATE DATABASE outflare_test"
          fi
      # Go's build cache, so a part compiles only what changed instead of the
      # whole engine (go vet alone took 5 minutes cold). setup-go's own cache
      # is keyed on go.sum and never refreshed, so it held almost nothing.
      # go-cache.yml fills it on every push to main; the parts and pull
      # requests only read it.
      #
      # It unpacks to several GB on a disk that also holds the Postgres and
      # ClickHouse images; when that ran out, the runner died mid-restore and
      # left no log. So remove preinstalled toolchains the tests never use,
      # and print the free space so a full disk shows. The removal runs in
      # the background: it took one to three minutes of every part, while
      # the runner starts with about 12 GB free and the cache (about 0.5 GB
      # packed, since go-cache.yml trims it) needs a few.
      # A self-hosted runner keeps its disk between jobs, and several runners
      # can share one disk: Go's caches and Docker's images fill it in time,
      # and a full disk fails the cache restore and the tests' databases.
      - name: Make room on a self-hosted runner
        id: room
        if: runner.environment != 'github-hosted'
        run: |
          df -h ~ | tail -1
          # Runners that share a disk fill it together: their caches take a
          # large part of it, and every job's test database needs room at the
          # same moment, so a disk that looks half free can run out mid-job.
          # So past 50% this runner gives back what it can rebuild: its Go
          # caches and its Docker images, build cache and stale volumes. Only
          # the runners that start a job while the disk is that full do it,
          # which brings it back under 50% without every job starting cold.
          docker container prune -f >/dev/null 2>&1 || true
          docker volume prune -af >/dev/null 2>&1 || docker volume prune -f >/dev/null 2>&1 || true
          docker builder prune -af >/dev/null 2>&1 || true
          used=$(df --output=pcent ~ | tail -1 | tr -dc 0-9)
          # Go trims its build cache only after five days, so a busy runner's
          # grows without limit: start it again past 8 GB.
          build=$(du -sm ~/.cache/go-build 2>/dev/null | cut -f1)
          echo "Go build cache: ${build:-0} MB"; docker system df 2>/dev/null || true
          if [ "${used:-0}" -ge 50 ] || [ "${build:-0}" -ge 8000 ]; then
            chmod -R u+w ~/go/pkg/mod 2>/dev/null || true
            rm -rf ~/.cache/go-build ~/go/pkg/mod
            docker system prune -af --volumes >/dev/null 2>&1 || true
            df -h ~ | tail -1
          fi
          # The runner still has its last job's Go caches: restoring the saved
          # one over them fails file by file (the module cache is read-only)
          # and costs half a minute of errors. Restore only onto an empty one.
          if [ -d ~/.cache/go-build ] && [ -d ~/go/pkg/mod ]; then echo "warm=true" >> "$GITHUB_OUTPUT"; fi
      - name: Make room for the Go build cache
        run: |
          df -h /
          sudo nohup rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /usr/share/swift >/dev/null 2>&1 &
      # The v3 in the key (here and in go-cache.yml) skips every cache saved
      # before it: bump it when a saved cache breaks restores.
      - name: Restore the Go build cache
        if: steps.room.outputs.warm != 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-build-v3-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-build-v3-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-build-v3-${{ runner.os }}-
      - name: Free space after the restore
        run: df -h /
      - name: gofmt
        if: matrix.part == 'rest' || matrix.part == 'quick'
        run: test -z "$(gofmt -l api engine)" || (gofmt -l api engine && exit 1)
      - if: matrix.part == 'rest' || matrix.part == 'quick'
        run: go vet ./...
      - name: Tests (${{ matrix.name }})
        env:
          PART: ${{ matrix.part }}
          FLAKY_FILE: ${{ runner.temp }}/flaky.txt
          CHANGED: ${{ needs.same-files.outputs.changed }}
          # The race detector runs nightly (scripts/test-shard.sh).
          RACE: ${{ needs.same-files.outputs.race == 'true' && '-race' || '' }}
        run: scripts/test-shard.sh $PART
      # A test that failed and then passed on its own re-run (test-shard.sh)
      # doesn't fail the check, but gets an issue so it is fixed, not ignored.
      # Issues are filed only in the private engine repository, where the
      # team works on them; anywhere else (this file is also published) the
      # run only warns.
      - name: File flaky tests
        if: github.repository == 'outflareai/engine'
        env:
          FLAKY_FILE: ${{ runner.temp }}/flaky.txt
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -s "$FLAKY_FILE" ] || exit 0
          while read -r pkg tests; do
            for t in $(echo "$tests" | tr '|' ' '); do
              title="Flaky test: $t (${pkg#github.com/outflareai/outflare/})"
              echo "::warning::$title passed only when re-run."
              n=$(gh issue list --state open --search "\"$title\" in:title" --json number,title --jq "map(select(.title == \"$title\")) | .[0].number // empty" || true)
              body="Failed, then passed when re-run on its own, in $RUN_URL (commit $GITHUB_SHA)."
              if [ -n "$n" ]; then gh issue comment "$n" --body "$body" || true
              else gh issue create --title "$title" --body "$body The check passed, so nothing was blocked; please make the test reliable. Never skip it." || true
              fi
            done
          done <"$FLAKY_FILE"

  # The web app, the TypeScript SDK and MCP server, and the Python SDK, in
  # one job: GitHub bills every job as at least a minute, and the Python
  # tests take 40 seconds. Each half runs only when the change touches it.
  web-and-sdk:
    needs: same-files
    # Runs unless this exact tree already passed, a pull request doesn't
    # touch what it builds, or it is the nightly race run. Runs if same-files
    # fails.
    if: ${{ !cancelled() && needs.same-files.outputs.race != 'true' && needs.same-files.outputs.tested != 'true' && (needs.same-files.outputs.web != 'false' || needs.same-files.outputs.python != 'false') }}
    # Not ubuntu-latest: the 26.04 image has no build of Python 3.9, the oldest
    # the Python SDK supports, which the SDK tests below install.
    runs-on: ubuntu-24.04
    # The web checks take about nine minutes and the library tests, on the
    # batches that run them, five to six more: at 15 the job was stopped
    # with nothing failing (2026-11-18, in the Python tests, its last step).
    timeout-minutes: 25
    env:
      WEB: ${{ needs.same-files.outputs.web }}
      PYTHON: ${{ needs.same-files.outputs.python }}
      LIBS: ${{ needs.same-files.outputs.libs }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        if: env.WEB != 'false'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: env.WEB != 'false'
        with:
          node-version: 22
          # A runner of your own keeps pnpm's store on its disk, and saving
          # it to the cache from there failed the job, so only GitHub's
          # machines use the cache.
          cache: ${{ runner.environment == 'github-hosted' && 'pnpm' || '' }}
      - if: env.WEB != 'false'
        run: pnpm install --frozen-lockfile
      - name: SDK types match api/openapi.yaml
        if: env.WEB != 'false'
        run: pnpm --filter @outflare/sdk generate && git diff --exit-code sdk/ts/src/schema.ts
      - if: env.WEB != 'false'
        run: pnpm -r build
      - name: Sales reporting periods, growth and funding destinations
        if: env.WEB != 'false'
        run: pnpm --filter @outflare/web test:sales-reporting-results
      - name: Chart forecast tests
        if: env.WEB != 'false'
        run: pnpm --filter @outflare/web test:forecast
      - name: Crash reporting only counts the app's own scripts
        if: env.WEB != 'false'
        run: pnpm --filter @outflare/web test:own-script
      - name: Tracking domain registration note
        if: env.WEB != 'false'
