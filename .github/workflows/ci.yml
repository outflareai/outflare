name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # Nightly: every test under the race detector, on main (scripts/test-shard.sh).
  schedule:
    - cron: "37 2 * * *"
  # For a push made with a workflow's own token, which starts no
  # workflows: that workflow starts this run itself. With race on, it is
  # the nightly run, started by Notify Cloud when the cron didn't fire.
  workflow_dispatch:
    inputs:
      race:
        description: Every part under the race detector (the nightly run)
        type: boolean
        default: false

# A newer push to a pull request replaces its run: Actions minutes are
# billed per job, so finishing a superseded run is money for nothing. Runs
# on main always finish.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only token: CI never writes to the repository.
permissions:
  contents: read

jobs:
  # Decides how much of CI this commit needs, so a pull request doesn't hold
  # one of the organisation's few Actions runners for work that can't fail.
  #
  # Pull requests get light checks; the merge queue's batch gets everything
  # once, for every pull request in it (Cloud's docs/merge-queue.md):
  #
  # - A pull request that is ready for review runs gofmt, go vet and the
  #   tests of the packages it changes and the packages that import them
  #   (the "light" part; the API package only when api/ or the package
  #   itself changed, in two shards then), and the web, SDK and Python jobs
  #   only when it changes what they build. A draft runs none of the Go
  #   tests, nor does a change to docs, change notes or web/ alone, nor a
  #   head that only merges main into a commit whose tests passed. A change
  #   to go.mod or go.sum runs every part. A migration runs the rollback
  #   check on the same light set.
  # - A batch (batch/*) runs every part, the Docker image when its inputs
  #   changed, and the migrations job (every part) when it adds a migration.
  # - On main, a commit whose files are exactly a commit CI already passed on
  #   (the batch the merge queue fast-forwarded main to, or a merge whose
  #   second parent is one) isn't tested again: every job is skipped and the
  #   run counts as passed.
  # - Nightly, every part runs on main under the race detector.
  same-files:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read # finds the earlier run
      checks: read # finds the Go tests that passed before main was merged in
      pull-requests: read # lists the pull request's files
    outputs:
      tested: ${{ steps.tree.outputs.tested }}
      go: ${{ steps.scope.outputs.go }}
      parts: ${{ steps.scope.outputs.parts || '[{"name":"api 1/5","part":"api 1 5"},{"name":"api 2/5","part":"api 2 5"},{"name":"api 3/5","part":"api 3 5"},{"name":"api 4/5","part":"api 4 5"},{"name":"api 5/5","part":"api 5 5"},{"name":"rest","part":"rest"}]' }}
      # The nightly race run: on the schedule, or dispatched with race on.
      race: ${{ github.event_name == 'schedule' || inputs.race == true }}
      migrations: ${{ steps.scope.outputs.migrations }}
      migration_parts: ${{ steps.scope.outputs.migration_parts }}
      changed: ${{ steps.scope.outputs.changed }}
      web: ${{ steps.scope.outputs.web || 'true' }}
      python: ${{ steps.scope.outputs.python || 'true' }}
      image: ${{ steps.scope.outputs.image || 'true' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: github.event_name == 'push'
        with:
          persist-credentials: false
          fetch-depth: 2
      # A pull request's own head and main's history, to tell a commit that
      # only merges main from one that changes something.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: github.event_name == 'pull_request' && !github.event.pull_request.draft
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Already tested?
        if: github.event_name == 'push'
        id: tree
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tree=$(git rev-parse HEAD^{tree})
          for c in HEAD HEAD^2; do
            sha=$(git rev-parse -q --verify "$c^{commit}" 2>/dev/null) || continue
            [ "$(git rev-parse "$sha^{tree}")" = "$tree" ] || continue
            ok=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$sha&status=success&per_page=50" \
              --jq "[.workflow_runs[] | select(.path == \".github/workflows/ci.yml\" and .id != $GITHUB_RUN_ID)] | length" || echo 0)
            if [ "$ok" -gt 0 ]; then
              echo "CI already passed on ${sha::7}, which has exactly these files; skipping."
              echo "tested=true" >> "$GITHUB_OUTPUT"; exit 0
            fi
          done
      - name: Do the Go tests need to run?
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          DRAFT: ${{ github.event.pull_request.draft }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ "$EVENT" != pull_request ]; then echo "go=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          batch=false
          case "$HEAD_REF" in batch/*) batch=true ;; esac
          if ! listed=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[] | "\(.status)\t\(.filename)"'); then
            echo "go=true" >> "$GITHUB_OUTPUT"; echo "migrations=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(cut -f2 <<<"$listed")
          has() { grep -qE "$1" <<<"$files"; }
          # The migrations job checks the migration files (append-only, unique
          # numbers, expand-only) on any pull request that touches them. The
          # previous version's tests on the new schema (the rollback check) run
          # when it adds a migration: on the pull request itself once it is
          # ready, on the light set (below), so its author finds a failure
          # there, and every part again in its batch. On 2026-11-01 the full
          # check on pull requests ran 55 times (about 30 billed minutes
          # each) and caught nothing.
          if has '^(engine/internal/db/migrations/|scripts/checkmigrations/)'; then echo "migrations=true" >> "$GITHUB_OUTPUT"; fi
          if [ "$DRAFT" = true ] || ! grep -qE '^added[[:space:]]engine/internal/db/migrations/' <<<"$listed"; then
            echo 'migration_parts=[{"name":"check","part":""}]' >> "$GITHUB_OUTPUT"
          elif [ "$batch" != true ]; then
            # Split like the engine job's light set when it holds the API
            # package: on its own, the previous version's API tests on the new
            # schema ran past go test's 25 minutes (2026-11-03).
            if has '^(api/|engine/internal/api/)'; then
              echo 'migration_parts=[{"name":"light 1/2","part":"light 1 2"},{"name":"light 2/2","part":"light 2 2"}]' >> "$GITHUB_OUTPUT"
            else
              echo 'migration_parts=[{"name":"light","part":"light"}]' >> "$GITHUB_OUTPUT"
            fi
          fi
          if [ "$batch" = true ]; then
            echo "::notice::A merge queue batch: everything runs."
            echo "go=true" >> "$GITHUB_OUTPUT"
            if ! has '^(Dockerfile|\.dockerignore|go\.(mod|sum)|pnpm-lock\.yaml|pnpm-workspace\.yaml|package\.json|[^/]+/package\.json)'; then echo "image=false" >> "$GITHUB_OUTPUT"; fi
            exit 0
          fi
          # A pull request on its own: only what it can break, and never the
          # Docker image (its batch builds it).
          echo "image=false" >> "$GITHUB_OUTPUT"
          has '^(web/|sdk/|mcp/|api/|package\.json|pnpm-|[^/]+/package\.json|engine/internal/ownkeys/)' || echo "web=false" >> "$GITHUB_OUTPUT"
          has '^(sdk/python/|api/)' || echo "python=false" >> "$GITHUB_OUTPUT"
          if [ "$DRAFT" = true ]; then
            echo "::notice::Draft: the Go tests run when this is marked ready for review."
            echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Files no Go test reads. web/ is TypeScript, and its one Go check
          # (ownkeys) also runs in web-and-sdk. Anything else, or a list we
          # can't read, runs the tests.
          other=$(printf '%s\n' "$files" | grep -vE '^(docs/|changes/|web/|[^/]+\.md$)' || true)
          if [ -n "$files" ] && [ -z "$other" ]; then
            echo "::notice::Only docs, change notes or web/ changed; the Go tests are skipped."
            echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # A head that only merges main (git's own merge, nothing edited)
          # into a commit whose Go tests passed changes nothing of the pull
          # request's: its batch tests it with main. Walk back over such
          # merges to the last commit the tests ran on.
          c=$HEAD_SHA tested=
          for _ in $(seq 20); do
            read -r p1 p2 rest <<<"$(git rev-list --parents -n 1 "$c" | cut -d' ' -f2-)" || break
            [ -n "$p2" ] && [ -z "$rest" ] || break
            git merge-base --is-ancestor "$p2" origin/main || break
            [ "$(git merge-tree --write-tree "$p1" "$p2" 2>/dev/null | head -1)" = "$(git rev-parse "$c^{tree}")" ] || break
            c=$p1
            passed=$(gh api "repos/$GITHUB_REPOSITORY/commits/$c/check-runs?per_page=100" \
              --jq '[.check_runs[] | select(.conclusion == "success" and (.name | test("^engine \\((light( [12]/2)?|api [1-3]/3|rest)\\)$"))) | .name] | unique | join(",")' || echo)
            case ",$passed," in *,engine\ \(light*|*engine\ \(api\ 1/3\),engine\ \(api\ 2/3\),engine\ \(api\ 3/3\),engine\ \(rest\)*) tested=$c; break ;; esac
          done
          if [ -n "$tested" ]; then
            echo "::notice::Only main merged in since ${tested::7}, where the Go tests passed; they are skipped."
            echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "go=true" >> "$GITHUB_OUTPUT"
          # A dependency change can break any package: every part. A schema
          # change used to as well; its batch runs every part anyway, and on
          # the pull request it cost 65 billed minutes a push for nothing
          # found (2026-11-01).
          if has '^go\.(mod|sum)$'; then
            echo "::notice::go.mod or go.sum changed; every part runs."
            exit 0
          fi
          # The light set runs in one job, or two when it holds the API
          # package (the slowest by far; scripts/test-shard.sh light).
          if has '^(api/|engine/internal/api/)'; then
            echo 'parts=[{"name":"light 1/2","part":"light 1 2"},{"name":"light 2/2","part":"light 2 2"}]' >> "$GITHUB_OUTPUT"
          else
            echo 'parts=[{"name":"light","part":"light"}]' >> "$GITHUB_OUTPUT"
          fi
          {
            echo "changed<<EOF_CHANGED"
            echo "$files"
            echo "EOF_CHANGED"
          } >> "$GITHUB_OUTPUT"

  # The tests run in six parts side by side, each with its own database
  # (scripts/test-shard.sh): the API package split in five, and everything
  # else. One job took 6-8 minutes; a batch is as slow as its slowest part.
  engine:
    needs: same-files
    # Runs unless this exact tree already passed, or the pull request doesn't
    # need it yet (above). Runs if same-files itself fails.
    if: ${{ !cancelled() && needs.same-files.outputs.tested != 'true' && needs.same-files.outputs.go != 'false' }}
    name: engine (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write # files a test that only passed when re-run
    strategy:
      fail-fast: false
      matrix:
        # api 1/5 to api 5/5 and rest; light (one or two shards) on a pull request
        # (same-files above).
        include: ${{ fromJSON(needs.same-files.outputs.parts || '[{"name":"api 1/5","part":"api 1 5"},{"name":"api 2/5","part":"api 2 5"},{"name":"api 3/5","part":"api 3 5"},{"name":"api 4/5","part":"api 4 5"},{"name":"api 5/5","part":"api 5 5"},{"name":"rest","part":"rest"}]') }}
    services:
      # Postgres with pgvector, so meaning-based search is tested. The
      # migrations job below keeps plain Postgres, which proves the engine
      # migrates and runs without it.
      postgres:
        image: pgvector/pgvector:0.8.0-pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: outflare_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 20
      # The optional analytics store (docs/adr/0010-analytics-storage.md).
      clickhouse:
        image: clickhouse/clickhouse-server:25.8
        env:
          CLICKHOUSE_DB: outflare_test
          CLICKHOUSE_USER: test
          CLICKHOUSE_PASSWORD: test
        ports: ["8123:8123"]
        options: >-
          --health-cmd "wget -qO- http://localhost:8123/ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/outflare_test?sslmode=disable
      CLICKHOUSE_TEST_URL: http://test:test@localhost:8123/outflare_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false
      # Go's build cache, so a part compiles only what changed instead of the
      # whole engine (go vet alone took 5 minutes cold). setup-go's own cache
      # is keyed on go.sum and never refreshed, so it held almost nothing.
      # go-cache.yml fills it on every push to main; the parts and pull
      # requests only read it.
      #
      # It unpacks to several GB on a disk that also holds the Postgres and
      # ClickHouse images; when that ran out, the runner died mid-restore and
      # left no log. So remove preinstalled toolchains the tests never use,
      # and print the free space so a full disk shows. The removal runs in
      # the background: it took one to three minutes of every part, while
      # the runner starts with about 12 GB free and the cache (about 0.5 GB
      # packed, since go-cache.yml trims it) needs a few.
      - name: Make room for the Go build cache
        run: |
          df -h /
          sudo nohup rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /usr/share/swift >/dev/null 2>&1 &
      # The v3 in the key (here and in go-cache.yml) skips every cache saved
      # before it: bump it when a saved cache breaks restores.
      - name: Restore the Go build cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-build-v3-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-build-v3-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-build-v3-${{ runner.os }}-
      - name: Free space after the restore
        run: df -h /
      - name: gofmt
        if: matrix.part == 'rest' || startsWith(matrix.part, 'light') && !endsWith(matrix.part, '2 2')
        run: test -z "$(gofmt -l api engine)" || (gofmt -l api engine && exit 1)
      - if: matrix.part == 'rest' || startsWith(matrix.part, 'light') && !endsWith(matrix.part, '2 2')
        run: go vet ./...
      - name: Tests (${{ matrix.name }})
        env:
          PART: ${{ matrix.part }}
          FLAKY_FILE: ${{ runner.temp }}/flaky.txt
          CHANGED: ${{ needs.same-files.outputs.changed }}
          # The race detector runs nightly (scripts/test-shard.sh).
          RACE: ${{ needs.same-files.outputs.race == 'true' && '-race' || '' }}
        run: scripts/test-shard.sh $PART
      # A test that failed and then passed on its own re-run (test-shard.sh)
      # doesn't fail the check, but gets an issue so it is fixed, not ignored.
      # Issues are filed only in the private engine repository, where the
      # team works on them; anywhere else (this file is also published) the
      # run only warns.
      - name: File flaky tests
        if: github.repository == 'outflareai/engine'
        env:
          FLAKY_FILE: ${{ runner.temp }}/flaky.txt
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -s "$FLAKY_FILE" ] || exit 0
          while read -r pkg tests; do
            for t in $(echo "$tests" | tr '|' ' '); do
              title="Flaky test: $t (${pkg#github.com/outflareai/outflare/})"
              echo "::warning::$title passed only when re-run."
              n=$(gh issue list --state open --search "\"$title\" in:title" --json number,title --jq "map(select(.title == \"$title\")) | .[0].number // empty" || true)
              body="Failed, then passed when re-run on its own, in $RUN_URL (commit $GITHUB_SHA)."
              if [ -n "$n" ]; then gh issue comment "$n" --body "$body" || true
              else gh issue create --title "$title" --body "$body The check passed, so nothing was blocked; please make the test reliable. Never skip it." || true
              fi
            done
          done <"$FLAKY_FILE"

  # The web app, the TypeScript SDK and MCP server, and the Python SDK, in
  # one job: GitHub bills every job as at least a minute, and the Python
  # tests take 40 seconds. Each half runs only when the change touches it.
  web-and-sdk:
    needs: same-files
    # Runs unless this exact tree already passed, a pull request doesn't
    # touch what it builds, or it is the nightly race run. Runs if same-files
    # fails.
    if: ${{ !cancelled() && needs.same-files.outputs.race != 'true' && needs.same-files.outputs.tested != 'true' && (needs.same-files.outputs.web != 'false' || needs.same-files.outputs.python != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WEB: ${{ needs.same-files.outputs.web }}
      PYTHON: ${{ needs.same-files.outputs.python }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        if: env.WEB != 'false'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: env.WEB != 'false'
        with:
          node-version: 22
          cache: pnpm
      - if: env.WEB != 'false'
        run: pnpm install --frozen-lockfile
      - name: SDK types match api/openapi.yaml
        if: env.WEB != 'false'
        run: pnpm --filter @outflare/sdk generate && git diff --exit-code sdk/ts/src/schema.ts
      - if: env.WEB != 'false'
        run: pnpm -r build
      - name: Browser for subscription brand checks
        if: env.WEB != 'false'
        run: pnpm --filter @outflare/web exec playwright install chromium --only-shell
      - name: Subscription brand assignment and workspace switching
        if: env.WEB != 'false'
        run: pnpm --filter @outflare/web test:ai-account-brands
      - if: env.WEB != 'false'
        run: pnpm --filter @outflare/sdk test
      - if: env.WEB != 'false'
        run: pnpm --filter @outflare/mcp test
      # The bring-your-own-keys scan (engine/internal/ownkeys, which reads
      # TypeScript too) runs in every light part and every batch, so not
      # here again: it cost two minutes on 267 runs a day.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: env.PYTHON != 'false'
        with:
          python-version: |
            3.9
            3.13
      - name: Python SDK tests on the oldest and newest supported Python
        if: env.PYTHON != 'false'
        working-directory: sdk/python
        run: |
          for py in 3.9 3.13; do
            python$py -m venv .venv-$py
            .venv-$py/bin/pip install -q -e '.[test]'
            .venv-$py/bin/pytest -q
          done
      - name: Python SDK lint
        if: env.PYTHON != 'false'
        working-directory: sdk/python
        run: pipx run ruff check . && pipx run ruff format --check .

  # The engine and web jobs already compile everything, so the image is
  # built only in a batch whose changes touch what goes into it, and on main
  # when main wasn't tested as a batch.
  docker:
    needs: same-files
    # Runs unless this exact tree already passed. Runs if same-files fails.
    if: ${{ !cancelled() && needs.same-files.outputs.race != 'true' && needs.same-files.outputs.tested != 'true' && needs.same-files.outputs.image != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: docker build -t outflare:ci .

  # Every deploy must be safe to roll back, and must not break the version
  # still serving while it starts (docs/migrations.md). The previous
  # version's tests run in the same parts as the engine job, each with its
  # own database; in one job they took 16 minutes. They run on a pull
  # request that adds a migration (once it is ready: the light set only) and
  # every part in its batch; any other pull request that touches migrations
  # runs only the checks.
  migrations-part:
    needs: same-files
    # Only pull requests that change migrations (above). Runs if same-files
    # fails.
    if: ${{ !cancelled() && github.event_name == 'pull_request' && (needs.same-files.outputs.migrations == 'true' || needs.same-files.result != 'success') }}
    name: migrations (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.same-files.outputs.migration_parts || '[{"name":"api 1/5","part":"api 1 5"},{"name":"api 2/5","part":"api 2 5"},{"name":"api 3/5","part":"api 3 5"},{"name":"api 4/5","part":"api 4 5"},{"name":"api 5/5","part":"api 5 5"},{"name":"rest","part":"rest"}]') }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: outflare_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      BASE: ${{ github.event.pull_request.base.sha }}
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/outflare_test?sslmode=disable
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/outflare_test?sslmode=disable
      OUTFLARE_SECRET_KEY: ZGV2LW9ubHktZGV2LW9ubHktZGV2LW9ubHktZGV2LTA=
      PART: ${{ matrix.part }}
      CHANGED: ${{ needs.same-files.outputs.changed }}
      # Like the engine job, no race detector (it runs nightly on main): the
      # base commit's scripts/test-shard.sh turns it on unless RACE is set,
      # and made this job two to three times slower than the rest.
      RACE: ""
      # Half the API package under -race runs past go test's default 10
      # minutes on a fresh schema. The tests run the base commit's
      # scripts/test-shard.sh, so the longer timeout comes from here; go list
      # and go vet ignore it.
      GOFLAGS: -timeout=25m
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false
      # The engine job's Go build cache (see there), so the previous
      # version's tests compile only what changed since main's last fill.
      - name: Make room for the Go build cache
        if: matrix.part != ''
        run: |
          df -h /
          sudo nohup rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /usr/share/swift >/dev/null 2>&1 &
      - name: Restore the Go build cache
        if: matrix.part != ''
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-build-v3-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ env.BASE }}
          restore-keys: |
            go-build-v3-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-build-v3-${{ runner.os }}-
      - name: Append-only, unique numbers, expand-only
        if: matrix.name == 'rest' || matrix.part == ''
        run: go run ./scripts/checkmigrations -base "$BASE"
      - name: Apply this branch's migrations
        if: matrix.part != ''
        run: go run ./engine/cmd/outflare migrate
      - name: The previous version's tests pass on the new schema
        # This is what runs while the new version starts, and after a
        # rollback: the base branch's code on this branch's database.
        if: matrix.part != ''
        run: |
          git checkout --quiet "$BASE"
          # shellcheck disable=SC2086 # the part is several words
          scripts/test-shard.sh $PART

  # The one check the merge queue waits for: passes when every part above
  # passed, and is skipped with them.
  migrations:
    needs: [same-files, migrations-part]
    if: ${{ !cancelled() && needs.migrations-part.result != 'skipped' }}
    runs-on: ubuntu-latest
    steps:
      - name: Every part passed
        env:
          RESULT: ${{ needs.migrations-part.result }}
        run: |
          echo "migrations parts: $RESULT"
          [ "$RESULT" = success ]

  # The nightly race run has no pull request to tell: a failure opens an
  # issue (or comments on the open one), only in the private engine
  # repository, where the team works on them.
  nightly-failed:
    needs: [same-files, engine]
    if: ${{ failure() && needs.same-files.outputs.race == 'true' && github.repository == 'outflareai/engine' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Open or update the issue
        run: |
          title="The nightly race tests failed"
          n=$(gh issue list --state open --search "\"$title\" in:title" --json number,title --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          body="The tests failed under the race detector on main at ${GITHUB_SHA::7}: $RUN_URL. Pull requests and batches run without it, so this is the only run that finds data races. Fix the race; never skip the test."
          if [ -n "$n" ]; then gh issue comment "$n" --body "$body"; else gh issue create --title "$title" --body "$body"; fi
