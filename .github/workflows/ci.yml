name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # For a push made with a workflow's own token, which starts no
  # workflows: that workflow starts this run itself.
  workflow_dispatch:

# A newer push to a pull request replaces its run: Actions minutes are
# billed per job, so finishing a superseded run is money for nothing. Runs
# on main always finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only token: CI never writes to the repository.
permissions:
  contents: read

jobs:
  # Decides how much of CI this commit needs, so a pull request doesn't hold
  # one of the organisation's few Actions runners for work that can't fail.
  #
  # On main, a commit whose files are exactly a commit CI already passed on
  # (a batch fast-forwarded to main, or a merge of a pull request that was
  # current with main, whose head is its second parent) isn't tested again:
  # every job below is skipped and the run counts as passed.
  #
  # On a pull request, the Go tests (the engine job, about 30 runner-minutes)
  # run only when it is ready for review, and only when it changes something
  # they read. A draft gets the quick checks; marking it ready runs the rest,
  # and it can't merge before that. Batch pull requests always run everything.
  same-files:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read # finds the earlier run
      pull-requests: read # lists the pull request's files
    outputs:
      tested: ${{ steps.tree.outputs.tested }}
      go: ${{ steps.scope.outputs.go }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: github.event_name == 'push'
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Already tested?
        if: github.event_name == 'push'
        id: tree
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tree=$(git rev-parse HEAD^{tree})
          for c in HEAD HEAD^2; do
            sha=$(git rev-parse -q --verify "$c^{commit}" 2>/dev/null) || continue
            [ "$(git rev-parse "$sha^{tree}")" = "$tree" ] || continue
            ok=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$sha&status=success&per_page=50" \
              --jq "[.workflow_runs[] | select(.path == \".github/workflows/ci.yml\" and .id != $GITHUB_RUN_ID)] | length" || echo 0)
            if [ "$ok" -gt 0 ]; then
              echo "CI already passed on ${sha::7}, which has exactly these files; skipping."
              echo "tested=true" >> "$GITHUB_OUTPUT"; exit 0
            fi
          done
      - name: Do the Go tests need to run?
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          DRAFT: ${{ github.event.pull_request.draft }}
          HEAD_REF: ${{ github.head_ref }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ "$EVENT" != pull_request ]; then echo "go=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          # A batch always runs everything. A release pull request changes
          # only CHANGELOG.md, so it skips the Go tests like any docs change:
          # its code is main's, which main's own CI tests.
          case "$HEAD_REF" in batch/*) echo "go=true" >> "$GITHUB_OUTPUT"; exit 0;; esac
          if [ "$DRAFT" = true ]; then
            echo "::notice::Draft: the Go tests run when this is marked ready for review."
            echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Files no Go test reads. web/ is TypeScript, and its one Go check
          # (ownkeys) also runs in web-and-sdk. Anything else, or a list we
          # can't read, runs the tests.
          if ! files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename'); then
            echo "go=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          other=$(printf '%s\n' "$files" | grep -vE '^(docs/|changes/|web/|[^/]+\.md$)' || true)
          if [ -n "$files" ] && [ -z "$other" ]; then
            echo "::notice::Only docs, change notes or web/ changed; the Go tests are skipped."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

  # The tests run in three parts side by side, each with its own database
  # (scripts/test-shard.sh): the API package split in two, and everything
  # else. One job took 6-8 minutes; each part takes about half that.
  engine:
    needs: same-files
    # Runs unless this exact tree already passed, or the pull request doesn't
    # need it yet (above). Runs if same-files itself fails.
    if: ${{ !cancelled() && needs.same-files.outputs.tested != 'true' && needs.same-files.outputs.go != 'false' }}
    name: engine (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write # files a test that only passed when re-run
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: api 1/2, part: api 1 2 }
          - { name: api 2/2, part: api 2 2 }
          - { name: rest, part: rest }
    services:
      # Postgres with pgvector, so meaning-based search is tested. The
      # migrations job below keeps plain Postgres, which proves the engine
      # migrates and runs without it.
      postgres:
        image: pgvector/pgvector:0.8.0-pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: outflare_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 20
      # The optional analytics store (docs/adr/0010-analytics-storage.md).
      clickhouse:
        image: clickhouse/clickhouse-server:25.8
        env:
          CLICKHOUSE_DB: outflare_test
          CLICKHOUSE_USER: test
          CLICKHOUSE_PASSWORD: test
        ports: ["8123:8123"]
        options: >-
          --health-cmd "wget -qO- http://localhost:8123/ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/outflare_test?sslmode=disable
      CLICKHOUSE_TEST_URL: http://test:test@localhost:8123/outflare_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false
      # Go's build cache, so a part compiles only what changed instead of the
      # whole engine (go vet alone took 5 minutes cold). setup-go's own cache
      # is keyed on go.sum and never refreshed, so it held almost nothing.
      # go-cache.yml fills it on every push to main; the parts and pull
      # requests only read it.
      #
      # It unpacks to several GB on a disk that also holds the Postgres and
      # ClickHouse images; when that ran out, the runner died mid-restore and
      # left no log. So first remove preinstalled toolchains the tests never
      # use, and print the free space either side so a full disk shows.
      - name: Make room for the Go build cache
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /usr/share/swift
          df -h /
      # The v2 in the key (here and in go-cache.yml) skips every cache saved
      # before it: bump it when a saved cache breaks restores.
      - name: Restore the Go build cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-build-v2-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            go-build-v2-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-build-v2-${{ runner.os }}-
      - name: gofmt
        if: matrix.part == 'rest'
        run: test -z "$(gofmt -l api engine)" || (gofmt -l api engine && exit 1)
      - if: matrix.part == 'rest'
        run: go vet ./...
      - name: Tests (${{ matrix.name }})
        env:
          PART: ${{ matrix.part }}
          FLAKY_FILE: ${{ runner.temp }}/flaky.txt
        run: scripts/test-shard.sh $PART
      # A test that failed and then passed on its own re-run (test-shard.sh)
      # doesn't fail the check, but gets an issue so it is fixed, not ignored.
      # Issues are filed only in the private engine repository, where the
      # team works on them; anywhere else (this file is also published) the
      # run only warns.
      - name: File flaky tests
        if: github.repository == 'outflareai/engine'
        env:
          FLAKY_FILE: ${{ runner.temp }}/flaky.txt
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -s "$FLAKY_FILE" ] || exit 0
          while read -r pkg tests; do
            for t in $(echo "$tests" | tr '|' ' '); do
              title="Flaky test: $t (${pkg#github.com/outflareai/outflare/})"
              echo "::warning::$title passed only when re-run."
              n=$(gh issue list --state open --search "\"$title\" in:title" --json number,title --jq "map(select(.title == \"$title\")) | .[0].number // empty" || true)
              body="Failed, then passed when re-run on its own, in $RUN_URL (commit $GITHUB_SHA)."
              if [ -n "$n" ]; then gh issue comment "$n" --body "$body" || true
              else gh issue create --title "$title" --body "$body The check passed, so nothing was blocked; please make the test reliable. Never skip it." || true
              fi
            done
          done <"$FLAKY_FILE"

  web-and-sdk:
    needs: same-files
    # Runs unless this exact tree already passed. Runs if same-files fails.
    if: ${{ !cancelled() && needs.same-files.outputs.tested != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: SDK types match api/openapi.yaml
        run: pnpm --filter @outflare/sdk generate && git diff --exit-code sdk/ts/src/schema.ts
      - run: pnpm -r build
      - run: pnpm --filter @outflare/sdk test
      - run: pnpm --filter @outflare/mcp test
      # The Go key scan reads TypeScript too, and runs here because a
      # web-only pull request skips the engine job.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: Workspaces bring their own keys
        run: go test ./engine/internal/ownkeys/

  # The engine and web jobs already compile everything, so on a pull request
  # the image is only rebuilt when what goes into it changes. main always
  # builds it.
  docker:
    needs: same-files
    # Runs unless this exact tree already passed. Runs if same-files fails.
    if: ${{ !cancelled() && needs.same-files.outputs.tested != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}
      - name: Does this change touch the image?
        id: image
        run: |
          if [ "${{ github.event_name }}" != pull_request ]; then echo "build=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if git diff --name-only "${{ github.event.pull_request.base.sha }}"...HEAD | grep -qE '^(Dockerfile|\.dockerignore|go\.(mod|sum)|pnpm-lock\.yaml|pnpm-workspace\.yaml|package\.json|[^/]+/package\.json)'; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.image.outputs.build == 'true'
        run: docker build -t outflare:ci .

  python-sdk:
    needs: same-files
    # Runs unless this exact tree already passed. Runs if same-files fails.
    if: ${{ !cancelled() && needs.same-files.outputs.tested != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: |
            3.9
            3.13
      - name: Tests on the oldest and newest supported Python
        run: |
          for py in 3.9 3.13; do
            python$py -m venv .venv-$py
            .venv-$py/bin/pip install -q -e '.[test]'
            .venv-$py/bin/pytest -q
          done
      - name: Lint
        run: pipx run ruff check . && pipx run ruff format --check .

  # Every deploy must be safe to roll back, and must not break the version
  # still serving while it starts (docs/migrations.md).
  migrations:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: outflare_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      BASE: ${{ github.event.pull_request.base.sha }}
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/outflare_test?sslmode=disable
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/outflare_test?sslmode=disable
      OUTFLARE_SECRET_KEY: ZGV2LW9ubHktZGV2LW9ubHktZGV2LW9ubHktZGV2LTA=
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: Append-only, unique numbers, expand-only
        run: go run ./scripts/checkmigrations -base "$BASE"
      - name: Does this change add migrations?
        id: added
        run: |
          n=$(git diff --name-only --diff-filter=A "$BASE"...HEAD -- engine/internal/db/migrations | wc -l)
          echo "count=$n" >> "$GITHUB_OUTPUT"
      - name: Apply this branch's migrations
        if: steps.added.outputs.count != '0'
        run: go run ./engine/cmd/outflare migrate
      - name: The previous version's tests pass on the new schema
        # This is what runs while the new version starts, and after a
        # rollback: the base branch's code on this branch's database.
        if: steps.added.outputs.count != '0'
        run: |
          git checkout --quiet "$BASE"
          # The whole API package runs here in one go (the engine job
          # splits it in two), so it needs more than go test's default
          # 10 minutes.
          go test -count=1 -p 1 -timeout 30m ./engine/...
