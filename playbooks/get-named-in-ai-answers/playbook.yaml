id: get-named-in-ai-answers
version: 2
title: Get named in AI answers
summary: See which questions AI assistants answer without naming or recommending you, and what to publish so they do.
description: |
  People ask ChatGPT, Claude and Perplexity which tool to use. If the
  answer names three competitors and not you, you lose the sale before
  anyone visits your site. This playbook drafts the questions buyers ask
  in your category (with how often people ask them), finds the ones where
  competitors are named or recommended and you aren't, reads the pages the
  assistants cite, and lists what to publish, correct or get listed on.
tier: clever
goals: [ai_answers, search]
publisher: outflare
author: { github: outflareai }
needs:
  connections:
    - capability: llm.sample
      label: An AI model to ask the questions
      recommended: [openai, claude, gemini]
    - capability: ai.demand
      label: DataForSEO, for real AI questions, demand and the daily benchmark
      recommended: [dataforseo]
      optional: true
inputs:
  - name: brand
    label: Brand
    example: Northpeak
  - name: category
    label: What you sell, in a few words
    example: project planning software for small agencies
steps:
  - say: Read the brand's score against competitors today, and what AI answers bring its site.
    tools: [getAIVisibility, listAICohorts]
  - say: Add a set of buyer questions for the category if there isn't one, drafted with real demand.
    tools: [createAICohort, draftAIPrompts, listAIPrompts]
  - say: Track the competitors answers recommend that the cohort doesn't follow yet.
    tools: [updateAICohort]
  - say: Read the fixes for questions that leave the brand out or recommend a competitor, and the answers behind them.
    tools: [listFixes, listAISamples, listAIFacts]
  - say: Read the cited pages worth being on, and compare with what competitors publish.
    tools: [listCoverageOpportunities, getSEOCompetitorGaps]
  - say: Post a short list of pages to write, facts to correct and pages to get listed on.
    tools: [addAgentRunUpdate]
guardrails:
  - Questions are asked with the workspace's own AI key, within its monthly AI limit.
measure:
  - metric: Share of AI answers
    how: "Share of sampled answers that name the brand, before and after."
  - metric: AI visibility score
    how: "The demand-weighted score, 0 to 100; a change counts when its range moves clear of the week before."
prompt: |
  Run the "Get named in AI answers" playbook for {{brand}}, which sells
  {{category}}. Check how often AI assistants name us today. If there's no
  set of buyer questions for our category, draft one. Then find the
  questions where answers leave us out or recommend a competitor instead,
  read the pages they cite, and give me a short list of pages to write,
  facts to correct and pages to get listed on so we get named and
  recommended.
example: |
  Northpeak was named in 4 of 40 answers about agency project tools. Most
  answers cited two comparison pages and a review site, none of which
  listed Northpeak; the list started with asking those three to add it.
