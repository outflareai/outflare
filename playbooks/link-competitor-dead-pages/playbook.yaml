id: link-competitor-dead-pages
version: 1
title: Take the links to your competitors' dead pages
summary: When a competitor deletes a page that others link to, show those sites what it said and offer your page instead.
description: |
  When a competitor removes a page, every site that linked to it now has
  a broken link. Outflare notices pages gone from tracked competitors'
  sitemaps, reads who links to them, and keeps what the page said from
  the Internet Archive, so your pitch can offer a page that covers the
  same thing.
tier: clever
goals: [search]
publisher: outflare
author: { github: outflareai }
needs:
  data:
    - { check: seo_site, label: Your site added to SEO }
    - { check: mailboxes, label: A mailbox to send pitches from }
  connections:
    - capability: seo.read
      label: Ahrefs or DataForSEO, to read who links to a page (paid, within its budget)
      recommended: [ahrefs, dataforseo]
    - capability: plan
      label: An AI model to read pages and write openers, unless you run this from your own AI app
      optional: true
      recommended: [claude, openai]
inputs:
  - name: site
    label: Site
    example: northpeak.example
steps:
  - say: List your competitors' pages that went dead and still have links, the most linking sites first.
    tools: [listSEOSites, listDeadPages]
  - say: For dead pages not read yet, read who links to them, after showing the cost and the budget.
    tools: [readLinks, getLinkRead]
  - say: Add the linking pages as competitor dead page prospects, with the dead page as evidence and your page that covers the same ground as the page to offer.
    tools: [addLinkProspects]
  - say: Check each new prospect's page with OutflareBot (free apart from the AI read) for whether it is up, already links, its broken links, what it is about and who to contact.
    tools: [checkLinkProspects, listLinkProspects]
  - say: Pick a sequence for the pitches whose first step uses {{custom.opener}}, or draft one (held, nothing sends) if none does.
    tools: [listLinkSequences, createSequence, previewSequence]
  - say: Start a pitch for each prospect worth asking, to its best contact. The workspace's AI writes an opener about their page, and each pitch waits for a person to approve it.
    tools: [startLinkPitch, listLinkPitches]
  - say: Report what was pitched and, later, what replied, agreed and went live.
    tools: [getLinkResults, listLinkProspects]
guardrails:
  - Never offers or agrees to pay for a link; a reply asking for money waits for a person.
  - Every pitch waits for a person's approval, unless they turned approval off for that sequence.
  - One pitch per website at a time, and never to a website that opted out or declined recently.
  - Every paid read shows its cost first and stays within the connection's budget.
  - Never criticises the competitor; the pitch is about the reader's broken link.
measure:
  - { metric: Live links, how: "Prospects from this playbook that reached Live within 60 days (Link building, Results tab)." }
  - { metric: Live links per pitch, how: "Live links divided by pitches sent for this method, on the Results tab." }
prompt: |
  Run the "Take the links to your competitors' dead pages" playbook for
  {{site}}. List competitor pages that went dead and still have links,
  read who links to the best ones (show me the cost first), and add those
  pages as prospects with our closest page to offer. Check them and
  pitch each with an opener about the dead link and what it used to say.
  Every pitch waits for my approval.
example: |
  A competitor of Northpeak deleted its sizing guide, which 41 sites
  linked to. Reading them cost 0.03 USD; 28 pages were still up with a
  contact, Northpeak's fitting guide was offered, and 6 switched.
