<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light only">
<meta name="supported-color-schemes" content="light">
<title>{{.Subject}}</title>
<style>
  :root { color-scheme: light only; }
  body { margin: 0; padding: 0; }
  a { color: inherit; }
</style>
</head>
<body style="margin:0;padding:0;background:#fafafa;">
{{if .Preview}}<div style="display:none;max-height:0;overflow:hidden;opacity:0;">{{.Preview}}</div>{{end}}
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#fafafa;">
<tr><td align="center" style="padding:40px 16px;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:480px;font-family:Geist,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
    <tr><td style="padding:0 4px 20px;">
      <a href="https://outflare.ai" style="display:inline-block;font-size:17px;font-weight:600;letter-spacing:-0.035em;color:#09090b;text-decoration:none;"><img src="https://outflare.ai/brand/png/outflare-lockup-black-640.png" width="110" height="22" alt="Outflare" style="display:block;width:110px;height:22px;border:0;outline:none;text-decoration:none;color:#09090b;font-size:17px;font-weight:600;"></a>
    </td></tr>
    <tr><td style="background:#ffffff;border:1px solid #e4e4e7;border-radius:12px;padding:32px;">
      <h1 style="margin:0 0 16px;font-size:20px;line-height:28px;font-weight:600;letter-spacing:-0.02em;color:#09090b;">{{.Heading}}</h1>
      {{range .Body}}<p style="margin:0 0 16px;font-size:14px;line-height:22px;color:#3f3f46;">{{.}}</p>
      {{end}}{{if .URL}}<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:24px 0;">
        <tr><td style="background:#18181b;border-radius:8px;">
          <a href="{{.URL}}" style="display:inline-block;padding:10px 18px;font-size:14px;line-height:20px;font-weight:500;color:#fafafa;text-decoration:none;">{{.Button}}</a>
        </td></tr>
      </table>
      <p style="margin:0 0 16px;font-size:12px;line-height:18px;color:#71717a;">If the button doesn't work, paste this link into your browser:<br><a href="{{.URL}}" style="color:#71717a;word-break:break-all;">{{.URL}}</a></p>
      {{end}}{{if .Note}}<p style="margin:24px 0 0;padding-top:16px;border-top:1px solid #e4e4e7;font-size:12px;line-height:18px;color:#71717a;">{{.Note}}</p>{{end}}
    </td></tr>
    <tr><td style="padding:20px 4px 0;font-size:12px;line-height:18px;color:#71717a;">
      Outflare · <a href="https://outflare.ai" style="color:#71717a;">outflare.ai</a>
    </td></tr>
  </table>
</td></tr>
</table>
</body>
</html>
